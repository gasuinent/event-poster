<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>② 행사형 · ③ 축제형 관리자 V5</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gugi&family=Jua&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#05080e;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{display:flex;min-height:100vh}.side{width:430px;padding:18px;background:#101b2b;overflow:auto}.side h2{margin:0 0 8px;font-size:20px}.hint{font-size:11px;color:#aeb9ca;line-height:1.5}.section{margin-top:15px;padding-top:13px;border-top:1px solid #30415b}.section h3{margin:0 0 9px;color:#ffd21c;font-size:15px}.form{display:grid;gap:7px}.form input,.form textarea,.edit input,.edit textarea,.fontbox select{width:100%;padding:9px;border:1px solid #40516a;border-radius:6px;background:#091426;color:#fff;font-size:12px}.form textarea,.edit textarea{min-height:52px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.label{font-size:11px;color:#ffd21c;font-weight:900;display:block;margin-bottom:4px}.formats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.formats button,.action,.preset button{padding:11px;border:1px solid #40516a;border-radius:7px;background:#17243a;color:#fff;font-weight:900;cursor:pointer}.formats button.active{background:#ffd21c;color:#111;border-color:#ffd21c}.action{width:100%;margin-top:8px;background:#1877d8}.action.yellow{background:#ffd21c;color:#111}.edit{padding:8px;border:1px solid #33445f;border-radius:7px;background:#0b1627;margin-bottom:7px}.edit label{display:block;color:#ffd21c;font-size:10px;font-weight:900;margin:0 0 4px}.fontbox{padding:10px;border:1px solid #33445f;border-radius:8px;background:#0b1627}.fontbox select{margin-bottom:7px}.preset{display:grid;grid-template-columns:1fr 1fr;gap:5px}.preset button{padding:8px;font-size:11px}.performer{padding:8px;border:1px solid #33445f;border-radius:7px;background:#0b1627;margin-bottom:6px}.phead{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px;color:#ffd21c}.phead button{background:#9d2333;color:#fff;border:0;border-radius:5px;padding:4px 7px;cursor:pointer}.performer input[type=text]{width:100%;margin-bottom:5px;padding:8px;background:#091426;color:#fff;border:1px solid #40516a;border-radius:6px}.thumb{width:55px;height:55px;object-fit:cover;display:none;border:1px solid #ffd21c}.view{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:20px;background:#03060b}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#061426;box-shadow:0 0 30px #000}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.08),rgba(0,5,20,.18) 45%,rgba(0,0,0,.82))}.f{position:absolute;inset:0;padding:26px 25px;text-align:center;z-index:2;text-shadow:2px 3px 5px #000}.small{font-size:13px;color:#ffd978;font-weight:900}.title{font-family:'Jua',sans-serif;font-size:62px;line-height:1.02;margin-top:10px}.highlight{font-family:'Jua',sans-serif;color:#ffd21c;font-size:58px;font-weight:900;line-height:1;margin-top:6px}.venue{font-size:16px;font-weight:900;margin-top:10px}.date{font-size:26px;color:#ffd21c;font-weight:900;margin-top:17px}.info2{position:absolute;left:25px;right:25px;top:365px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:rgba(0,0,0,.68);border:1px solid #d4ab54;border-radius:8px;padding:10px;text-align:left;min-height:105px}.box h4{color:#ffd21c;text-align:center;margin:0 0 6px;font-size:13px}.box p{margin:3px 0;font-size:9px;line-height:1.4}.peopleTitle{position:absolute;left:25px;right:25px;top:500px;color:#ffd21c;font-weight:900;font-size:15px}.people{position:absolute;left:25px;right:25px;top:527px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.person{background:rgba(0,0,0,.82);border:1px solid #ffd21c;overflow:hidden;min-width:0}.person img,.blank{width:100%;height:67px;object-fit:cover;background:#111;display:block}.person b{display:block;font-size:7px;padding:4px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{position:absolute;left:25px;right:25px;bottom:17px;font-size:10px}.footerGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.footerLine{display:block;line-height:1.4;padding:8px 5px;border-radius:8px;text-align:center;background:#ffd21c;color:#142039;font-weight:900}.f3 .title{font-size:67px;color:#fff;text-shadow:4px 5px 0 #a31313,6px 7px 7px #000}.f3 .highlight{font-size:64px}.ribbon{position:relative;display:block;width:84%;margin:15px auto 14px;background:#c61c1c;border:2px solid #ffbd24;padding:11px 28px;font-size:14px;font-weight:900;line-height:1.25;z-index:1;box-shadow:0 4px 8px rgba(0,0,0,.45)}.ribbon:before,.ribbon:after{content:"";position:absolute;top:3px;width:58px;height:calc(100% - 6px);background:#a91414;border:2px solid #ffbd24;z-index:-1}.ribbon:before{left:-44px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,25% 50%)}.ribbon:after{right:-44px;clip-path:polygon(0 0,100% 0,75% 50%,100% 100%,0 100%)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta div{background:rgba(0,0,0,.75);border:1px solid #ffd21c;border-radius:7px;padding:9px;font-size:10px}.f3 .peopleTitle{top:405px}.f3 .people{top:432px}.cards{position:absolute;left:25px;right:25px;bottom:65px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.card{background:rgba(255,255,255,.96);color:#111;text-shadow:none;border-radius:12px;padding:30px 7px 7px;min-height:155px;position:relative;border:2px solid #d7b04b;overflow:visible}.card h4{position:absolute;left:50%;top:-17px;transform:translateX(-50%);margin:0;width:92%;padding:8px 4px;background:#ffd21c;color:#111;border:2px solid #fff0a0;border-radius:22px;font-family:'Jua',sans-serif;font-size:12px;line-height:1.05;text-align:center;white-space:normal;box-shadow:0 3px 7px #000}.card h4:before,.card h4:after{content:'';position:absolute;top:50%;width:14px;height:14px;background:inherit;border:inherit;transform:translateY(-50%) rotate(45deg);z-index:-1}.card h4:before{left:-7px}.card h4:after{right:-7px}.card:nth-child(2) h4{background:#ff7f20;color:#fff}.card:nth-child(3) h4{background:#31a85c;color:#fff}.card:nth-child(4) h4{background:#7654c9;color:#fff}.card p{margin:5px 2px;font-size:8px;line-height:1.35}.cardImg{width:100%;height:43px;object-fit:cover;margin-top:4px;border-radius:5px;display:none}.hidden{display:none!important}@media(max-width:900px){.wrap{display:block}.side{width:100%}.view{min-height:100vh}.poster{transform-origin:top center;transform:scale(.82);margin-bottom:-170px}}</style></head><body><div class="wrap"><aside class="side"><h2>🎨 ② 행사형 · ③ 축제형 관리자 V5</h2><div class="hint">기존 ① 관리자와 별개입니다. 이번 화면에서만 행사형·축제형을 수정합니다.</div><div class="section"><h3>① 포스터 형식</h3><div class="formats"><button id="f2" class="active">② 행사형</button><button id="f3">③ 축제형</button></div></div><div class="section"><h3>② 행사 기본정보</h3><div class="form"><input id="top" value="변화와 혁신! 도약하는 울진"><input id="title" value="울진바지게 달빛야시장"><input id="hi" value="야간장터"><div class="row"><div><label class="label">날짜 · 달력</label><input id="date" type="date" value="2026-08-29"></div><div><label class="label">시간</label><input id="time" type="time" value="19:00"></div></div><input id="dateText" placeholder="날짜 추가 문구 (예: 8.29.(토) – 30.(일))"><input id="timeText" placeholder="시간 추가 문구 (예: 개막식 19:00 ~ 22:00)"><input id="venue" value="울진바지게시장 일원"><div class="row"><div><label class="label">주최</label><input id="host" value="가수인생활 엔터테인먼트"></div><div><label class="label">주관</label><input id="organizer" value="가수인생활 엔터테인먼트"></div></div><input id="sub" value="먹거리 · 볼거리 · 즐길거리 가득한 야간장터!"><label class="label">배경 이미지</label><input id="bgFile" type="file" accept="image/*"><textarea id="program">먹거리 판매운영 · 맥주/음료 · 무료증정 이벤트

달빛 소리길 챌린지 · 에어바운스 놀이터</textarea></div></div><div class="section"><h3>③ 축제형 하단 4개 칸</h3><div class="hint">제목은 나비넥타이형 제목바로 표시되고, 아래 내용은 자유롭게 수정합니다.</div><div class="edit"><label>1번 제목</label><input id="c1t" value="맛있는 먹거리"><label>내용</label><textarea id="c1b">지역농산물 판매
다양한 먹거리</textarea></div><div class="edit"><label>2번 제목</label><input id="c2t" value="신나는 공연"><label>내용</label><textarea id="c2b">주민공연

체험부스</textarea></div><div class="edit"><label>4번 제목</label><input id="c4t" value="특별 이벤트"><label>내용</label><textarea id="c4b">상품권 증정
현장 참여</textarea></div></div><div class="section"><h3>④ 출연자 관리</h3><div class="hint">처음 1명부터 시작합니다. 한 사람씩 추가하며 최대 7명입니다.</div><button id="add" class="action">＋ 출연자 추가</button><div id="performers"></div></div><div class="section"><h3>⑤ 글씨 디자인</h3><div class="fontbox"><label class="label">제목 글씨체</label><select id="font"><option value="Jua">주아체 · 굵고 친근한 축제체</option><option value="Black Han Sans">블랙한산스 · 강한 행사체</option><option value="Do Hyeon">도현체 · 힘있는 고딕</option><option value="Gugi">구기체 · 개성있는 제목체</option><option value="Nanum Pen Script">나눔펜 · 손글씨</option><option value="Noto Serif KR">본명조 · 고급 명조</option></select><label class="label">제목 효과</label><select id="effect"><option value="festival">축제형 · 흰색 + 빨강 그림자</option><option value="yellow">야시장형 · 노랑 + 검정 그림자</option><option value="classic">고급형 · 크림색 + 부드러운 그림자</option><option value="strong">행사형 · 흰색 + 강한 그림자</option></select><div class="preset"><button type="button" data-font="Black Han Sans" data-effect="festival">축제형</button><button type="button" data-font="Jua" data-effect="yellow">야시장형</button><button type="button" data-font="Noto Serif KR" data-effect="classic">고급형</button><button type="button" data-font="Do Hyeon" data-effect="strong">행사형</button></div></div></div><div class="section"><button id="download" class="action yellow">⬇ 현재 포스터 PNG 저장</button></div></aside><main class="view"><div id="poster" class="poster"><img id="bg" class="bg"><div class="overlay"></div><section id="canvas2" class="f"><div class="small" id="vtop"></div><div class="title" id="vtitle"></div><div class="highlight" id="vhi"></div><div class="venue" id="vvenue"></div><div class="date" id="vdate"></div><div class="info2"><div class="box"><h4>행사 프로그램</h4><div id="vprogram"></div></div><div class="box"><h4>행사 안내</h4><p id="vhost"></p><p id="vorg"></p><p id="vtime"></p><p id="vsub"></p></div></div><div class="peopleTitle">출연진</div><div id="people2" class="people"></div><div class="footer"><div class="footerGrid"><span class="footerLine" id="vhost2"></span><span class="footerLine" id="vorg2"></span></div></div></section><section id="canvas3" class="f f3 hidden"><div class="small" id="vtop3"></div><div class="title" id="vtitle3"></div><div class="highlight" id="vhi3"></div><div class="ribbon" id="vribbon"></div><div class="meta"><div id="vdate3"></div><div id="vvenue3"></div></div><div class="peopleTitle">출연진</div><div id="people3" class="people"></div><div id="cards" class="cards"></div><div class="footer"><div class="footerGrid"><span class="footerLine" id="vhost3"></span><span class="footerLine" id="vorg3"></span></div></div></section></div></main></div><script>const $=id=>document.getElementById(id);let format=2,performers=[{name:'',src:''}];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dateDisplay(){const d=$('date').value;if($('dateText').value.trim())return $('dateText').value.trim();if(!d)return '';const a=d.split('-');return `${a[0]}. ${Number(a[1])}. ${Number(a[2])}.`}function timeDisplay(){return $('timeText').value.trim()||$('time').value}function render(){const date=dateDisplay(),time=timeDisplay();$('vtop').textContent=$('top').value;$('vtitle').textContent=$('title').value;$('vhi').textContent=$('hi').value;$('vvenue').textContent=$('venue').value;$('vdate').textContent=date+' · '+time;$('vprogram').innerHTML=esc($('program').value).split(/\r?\n/).map(x=>`<p>${x}</p>`).join('');$('vhost').textContent='주최 : '+$('host').value;$('vorg').textContent='주관 : '+$('organizer').value;$('vtime').textContent=time;$('vsub').textContent=$('sub').value;$('vhost2').textContent='주최 : '+$('host').value;$('vorg2').textContent='주관 : '+$('organizer').value;$('vtop3').textContent=$('top').value;$('vtitle3').textContent=$('title').value;$('vhi3').textContent=$('hi').value;$('vribbon').textContent=$('sub').value;$('vdate3').textContent='📅 '+date+' · '+time;$('vvenue3').textContent='📍 '+$('venue').value;$('vhost3').textContent='주최 : '+$('host').value;$('vorg3').textContent='주관 : '+$('organizer').value;const p=performers.map(x=>`<div class="person">${x.src?`<img src="${x.src}">`:'<div class="blank"></div>'}<b>${esc(x.name||'출연가수')}</b></div>`).join('');$('people2').innerHTML=p;$('people3').innerHTML=p;const cs=[['c1t','c1b'],['c2t','c2b'],['c3t','c3b'],['c4t','c4b']];$('cards').innerHTML=cs.map(x=>`<div class="card"><h4>${esc($(x[0]).value)}</h4>`+esc($(x[1]).value).split(/\r?\n/).map(t=>`<p>• ${t}</p>`).join('')+'</div>').join('');$('canvas2').classList.toggle('hidden',format!==2);$('canvas3').classList.toggle('hidden',format!==3);applyFont()}function build(){const box=$('performers');box.innerHTML='';performers.forEach((p,i)=>{const d=document.createElement('div');d.className='performer';d.innerHTML=`<div class="phead"><span>출연자 ${i+1}</span>${performers.length>1?'<button type="button">삭제</button>':''}</div><input type="text" value="${esc(p.name)}" placeholder="가수 이름 또는 직책 + 이름"><input type="file" accept="image/*"><img class="thumb">`;const n=d.querySelector('input[type=text]'),f=d.querySelector('input[type=file]'),im=d.querySelector('.thumb');n.oninput=()=>{p.name=n.value;render()};d.querySelector('.phead button')?.addEventListener('click',()=>{performers.splice(i,1);build();render()});f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{p.src=r.result;im.src=p.src;im.style.display='block';render()};r.readAsDataURL(file)};box.appendChild(d)})}function applyFont(){const f=$( 'font').value,e=$('effect').value;[$('vtitle'),$('vtitle3')].forEach(x=>{x.style.fontFamily="'"+f+"',sans-serif";x.style.color=e==='yellow'?'#ffd21c':e==='classic'?'#f4d7a1':'#fff';x.style.textShadow=e==='festival'?'4px 5px 0 #a31313,6px 7px 7px #000':'3px 4px 0 #000,5px 6px 7px #000'});[$('vhi'),$('vhi3')].forEach(x=>{x.style.fontFamily="'"+f+"',sans-serif";x.style.color=e==='classic'?'#f4d7a1':'#ffd21c';x.style.textShadow='3px 4px 0 #000,5px 6px 7px #000'})}document.querySelectorAll('.form input,.form textarea,.edit input,.edit textarea').forEach(e=>e.addEventListener('input',render));$('font').onchange=applyFont;$('effect').onchange=applyFont;document.querySelectorAll('.preset button').forEach(b=>b.onclick=()=>{$('font').value=b.dataset.font;$('effect').value=b.dataset.effect;applyFont()});$('f2').onclick=()=>{format=2;$('f2').classList.add('active');$('f3').classList.remove('active');render()};$('f3').onclick=()=>{format=3;$('f3').classList.add('active');$('f2').classList.remove('active');render()};$('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bg').src=r.result};r.readAsDataURL(f)};$('add').onclick=()=>{if(performers.length>=7){alert('출연자는 최대 7명까지 추가할 수 있습니다.');return}performers.push({name:'',src:''});build();render()};$('download').onclick=async()=>{const target=format===3?$('canvas3'):$('canvas2');const old=target.style.transform;target.style.transform='none';const c=await html2canvas($('poster'),{scale:2,useCORS:true,backgroundColor:null});target.style.transform=old;const a=document.createElement('a');a.download='행사포스터.png';a.href=c.toDataURL('image/png');a.click()};build();render();</script></body></html>
