ine-height:1.4}';d.head.appendChild(s);const sec=d.createElement('div');sec.className='section';sec.innerHTML='<h3>⑤ 글씨 디자인</h3><div class="v5fontbox"><div class="note">제목과 강조문구를 포스터 분위기에 맞게 바꿉니다.</div><select id="v5titleFont"><option value="Jua">주아 · 굵고 친근한 축제체</option><option value="Black Han Sans">블랙한산스 · 강한 행사체</option><option value="Do Hyeon">도현 · 힘있는 고딕</option><option value="Gugi">구기 · 개성있는 제목체</option><option value="Nanum Pen Script">나눔펜 · 손글씨</option><option value="Song Myung">송명 · 고급 명조</option><option value="Noto Serif KR">본명조 · 고급 명조</option></select><select id="v5effect"><option value="festival">축제 붓글씨 · 흰색+빨강 테두리</option><option value="yellow">노랑 붓글씨 · 강한 그림자</option><option value="classic">고급 명조 · 깔끔한 그림자</option><option value="strong">굵은 행사체 · 검정 그림자</option></select><div class="preset"><button type="button" data-p="festival">축제형</button><button type="button" data-p="yellow">야시장형</button><button type="button" data-p="classic">고급형</button><button type="button" data-p="strong">행사형</button></div></div></div>';const formats=d.querySelector('.formats');if(formats)formats.parentNode.parentNode.insertBefore(sec,formats.parentNode.nextSibling);function applyFont(){const f=d.getElementById('v5titleFont').value,e=d.getElementById('v5effect').value,t=[d.getElementById('vtitle'),d.getElementById('vtitle3')],h=[d.getElementById('vhi'),d.getElementById('vhi3')];t.forEach(x=>{if(x){x.style.fontFamily="'"+f+"',sans-serif";x.style.color=e==='yellow'?'#ffd21c':e==='classic'?'#f4d7a1':'#fff';x.style.textShadow=e==='festival'?'4px 5px 0 #a31313,6px 7px 7px #000':'3px 4px 0 #000,5px 6px 7px #000'}});h.forEach(x=>{if(x){x.style.fontFamily="'"+f+"',sans-serif";x.style.color=e==='classic'?'#f4d7a1':'#ffd21c';x.style.textShadow='3px 4px 0 #000,5px 6px 7px #000'}})}d.getElementById('v5titleFont').onchange=applyFont;d.getElementById('v5effect').onchange=applyFont;sec.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{d.getElementById('v5effect').value=b.dataset.p;d.getElementById('v5titleFont').value=b.dataset.p==='festival'?'Black Han Sans':b.dataset.p==='yellow'?'Jua':b.dataset.p==='classic'?'Noto Serif KR':'Do Hyeon';applyFont()});applyFont();const add=d.getElementById('add');if(add&&!add.dataset.v5fixed){add.dataset.v5fixed='1';add.addEventListener('click',()=>setTimeout(()=>{try{w.eval("if(performers.length===0){performers.push({name:'',src:''});build();render();}")}catch(e){}},0))}}frame.addEventListener('load',()=>setTimeout(patch,400));</script></body></html>
