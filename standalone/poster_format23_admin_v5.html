<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>② 행사형 · ③ 축제형 관리자 V5</title><style>html,body{margin:0;width:100%;height:100%;background:#05080e;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./poster_format23_admin_v3.html"></iframe><script>const frame=document.getElementById('app');function patch(){const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;try{w.eval("performers.splice(0,performers.length); performers.push({name:'',src:''}); build(); render();");}catch(e){const box=d.getElementById('performers');if(box)box.innerHTML='';}const host=d.getElementById('host'),org=d.getElementById('organizer');if(host){host.value='가수인생활 엔터테인먼트';host.placeholder='주최를 직접 입력';host.dispatchEvent(new Event('input',{bubbles:true}))}if(org){org.value='가수인생활 엔터테인먼트';org.placeholder='주관을 직접 입력';org.dispatchEvent(new Event('input',{bubbles:true}))}const s=d.createElement('style');s.textContent='.footer{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;background:transparent!important;border:0!important;padding-top:0!important;text-shadow:none!important}.footerLine{display:block!important;text-align:center!important;padding:7px 4px!important;border:1px solid #ffd21c!important;border-radius:7px!important;background:rgba(0,0,0,.82)!important;color:#fff!important;font-weight:900!important;line-height:1.3!important}.f3 .footer{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;background:transparent!important;color:#142039!important;border:0!important;padding:0!important}.f3 .footerLine{background:#ffd21c!important;color:#142039!important;border:1px solid #e0a900!important;border-radius:18px!important;padding:7px 4px!important}.v5fontbox{margin-top:8px;padding:10px;border:1px solid #33445f;border-radius:8px;background:#0b1627}.v5fontbox select,.v5fontbox button{width:100%;margin-top:6px;padding:8px;border:1px solid #40516a;border-radius:6px;background:#17243a;color:#fff;font-weight:800}.v5fontbox button{cursor:pointer}.v5fontbox .preset{display:grid;grid-template-columns:1fr 1fr;gap:5px}.v5fontbox .preset button{margin-top:0;font-size:11px}.v5fontbox .note{font-size:10px;color:#aeb9ca;line-height:1.4}';d.head.appendChild(s);const link=d.createElement('link');link.rel='stylesheet';link.href='https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang&family=Gugi&family=Jua&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;700;900&family=Song+Myung&display=swap';d.head.appendChild(link);const sec=d.createElement('div');sec.className='section';sec.innerHTML='<h3>⑤ 글씨 디자인</h3><div class="v5fontbox"><div class="note">제목과 강조문구를 포스터 분위기에 맞게 바꿉니다.</div><select id="v5titleFont"><option value="Jua">주아 · 굵고 친근한 축제체</option><option value="Black Han Sans">블랙한산스 · 강한 행사체</option><option value="Do Hyeon">도현 · 힘있는 고딕</option><option value="Gugi">구기 · 개성있는 제목체</option><option value="Nanum Pen Script">나눔펜 · 손글씨</option><option value="Song Myung">송명 · 고급 명조</option><option value="Noto Serif KR">본명조 · 고급 명조</option></select><select id="v5effect"><option value="festival">축제 붓글씨 · 흰색+빨강 테두리</option><option value="yellow">노랑 붓글씨 · 강한 그림자</option><option value="classic">고급 명조 · 깔끔한 그림자</option><option value="strong">굵은 행사체 · 검정 그림자</option></select><div class="preset"><button type="button" data-p="festival">축제형</button><button type="button" data-p="yellow">야시장형</button><button type="button" data-p="classic">고급형</button><button type="button" data-p="strong">행사형</button></div></div></div>';const formats=d.querySelector('.formats');if(formats&&formats.parentNode){formats.parentNode.parentNode.insertBefore(sec,formats.parentNode.nextSibling)}function applyFont(){const f=d.getElementById('v5titleFont').value,e=d.getElementById('v5effect').value;const t=[d.getElementById('vtitle'),d.getElementById('vtitle3')],h=[d.getElementById('vhi'),d.getElementById('vhi3')];t.forEach(x=>{if(x)x.style.fontFamily='\''+f+'\',sans-serif';});h.forEach(x=>{if(x)x.style.fontFamily='\''+f+'\',sans-serif';});const ts=e==='festival'?'#fff':e==='yellow'?'#ffd21c':e==='classic'?'#f4d7a1':'#fff';const hs=e==='yellow'?'#ffd21c':e==='classic'?'#f4d7a1':'#ffd21c';t.forEach(x=>{if(x)x.style.color=ts;});h.forEach(x=>{if(x)x.style.color=hs;});if(e==='festival'){t.forEach(x=>{if(x)x.style.textShadow='4px 5px 0 #a31313,6px 7px 7px #000';});h.forEach(x=>{if(x)x.style.textShadow='3px 4px 0 #8a3b00,5px 6px 6px #000';})}else if(e==='yellow'){t.forEach(x=>{if(x)x.style.textShadow='3px 4px 0 #000,5px 6px 7px #000';});h.forEach(x=>{if(x)x.style.textShadow='3px 4px 0 #000,5px 6px 7px #000';})}else if(e==='classic'){t.forEach(x=>{if(x)x.style.textShadow='2px 3px 5px #000';});h.forEach(x=>{if(x)x.style.textShadow='2px 3px 5px #000';})}else{t.forEach(x=>{if(x)x.style.textShadow='3px 4px 0 #000,5px 6px 7px #000';});h.forEach(x=>{if(x)x.style.textShadow='3px 4px 0 #000,5px 6px 7px #000';})}}d.getElementById('v5titleFont').onchange=applyFont;d.getElementById('v5effect').onchange=applyFont;sec.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{d.getElementById('v5effect').value=b.dataset.p;if(b.dataset.p==='festival')d.getElementById('v5titleFont').value='Black Han Sans';if(b.dataset.p==='yellow')d.getElementById('v5titleFont').value='Jua';if(b.dataset.p==='classic')d.getElementById('v5titleFont').value='Noto Serif KR';if(b.dataset.p==='strong')d.getElementById('v5titleFont').value='Do Hyeon';applyFont()});applyFont();const add=d.getElementById('add');if(add&&!add.dataset.v5fixed){add.dataset.v5fixed='1';add.addEventListener('click',()=>{setTimeout(()=>{try{w.eval("if(performers.length===0){performers.push({name:'',src:''});build();render();}");}catch(e){}},0)})}}frame.addEventListener('load',()=>setTimeout(patch,400));</script></body></html>
