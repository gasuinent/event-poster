venue').textContent=vals.venue;$('vdate').textContent=dateDisplay+' · '+timeDisplay;$('vprogram').innerHTML=esc($('program').value).split('\n').map(x=>`<p>${x}</p>`).join('');$('vhost').textContent='주최 · '+vals.host;$('vorg').textContent='주관 · '+vals.organizer;$('vtime').textContent=timeDisplay;$('vsub').textContent=vals.sub;$('vfooter').textContent='주최 : '+vals.host+'<br>주관 : '+vals.organizer;$('vtop3').textContent=vals.top;$('vtitle3').textContent=vals.title;$('vhi3').textContent=vals.hi;$('vribbon').textContent=vals.sub;$('vdate3').textContent=dateDisplay+' · '+timeDisplay;$('vvenue3').textContent='📍 '+vals.venue;$('vfooter3').textContent='주최 : '+vals.host+'<br>주관 : '+vals.organizer;let phtml=performers.map((p,i)=>`<div class="person">${p.src?`<img src="${p.src}">`:'<div class="blank"></div>'}<b>${esc(p.name||'출연가수')}</b></div>`).join('');$('people2').innerHTML=phtml;$('people3').innerHTML=phtml;let cards=[['c1t','c1b'],['c2t','c2b'],['c3t','c3b'],['c4t','c4b']].map(x=>{let lines=($(x[1]).value||'').split('\n');return `<div class="card"><h4>${esc($(x[0]).value)}</h4>`+lines.map(t=>`<p>${esc(t)}</p>`).join('')+`</div>`}).join('');$('cards').innerHTML=cards;$('canvas2').classList.toggle('hidden',format!==2);$('canvas3').classList.toggle('hidden',format!==3)}document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',render));document.querySelectorAll('input[type=date],input[type=time]').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('input[type=date],input[type=time]').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('input[type=date],input[type=time]').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('input[type=date],input[type=time]').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('input[type=date],input[type=time]').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('input[type=date],input[type=time]'). iles[0];if(f){let r=new FileReader();r.onload=()=>{$('bg').src=r.result};r.readAsDataURL(f)}};$('add').onclick=()=>{if(performers.length>=7)return alert('출연자는 최대 7명입니다.');let i=performers.length;performers.push({name:'출연가수',src:''});let wrap=document.createElement('div');wrap.className='performer';wrap.innerHTML=`<div class="phead"><span>출연자 ${i+1}</span><button type="button">삭제</button></div><input type="text" value="출연가수"><input type="file" accept="image/*"><img class="thumb">`;let text=wrap.querySelector('input[type=text]');let file=wrap.querySelector('input[type=file]');text.oninput=()=>{performers[i].name=text.value;render()};file.onchange=()=>{let f=file.files[0];if(f){let r=new FileReader();r.onload=()=>{performers[i].src=r.result;wrap.querySelector('.thumb').src=r.result;wrap.querySelector('.thumb').style.display='block';render()};r.readAsDataURL(f)}};wrap.querySelector('button').onclick=()=>{performers.splice(i,1);buildPerformers()};$('performers').appendChild(wrap);render()};function buildPerformers(){ $('performers').innerHTML='';let old=[...performers];performers=[];old.forEach(p=>{ $('add').click();let i=performers.length-1;performers[i]=p;let box=$('performers').lastElementChild;box.querySelector('input[type=text]').value=p.name;box.querySelector('input[type=text]').oninput=()=>{performers[i].name=box.querySelector('input[type=text]').value;render()};if(p.src){box.querySelector('.thumb').src=p.src;box.querySelector('.thumb').style.display='block'}});render()}$('download').onclick=async()=>{let canvas=await html2canvas($('poster'),{useCORS:true,scale:2,backgroundColor:null});let a=document.createElement('a');a.download=(format===2?'행사형':'축제형')+'_포스터.png';a.href=canvas.toDataURL('image/png');a.click()};$('reset').onclick=()=>location.reload();$('bg').src='';render();$('add').click();</script></body></html>
