<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>② 행사형 포스터</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;display:flex;justify-content:center;padding:30px}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#10234a;box-shadow:0 0 30px #000}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,8,25,.25),rgba(0,8,25,.82))}.content{position:absolute;inset:0;padding:28px 24px;text-align:center;text-shadow:2px 3px 5px #000}.headline{font-size:15px;color:#ffd76a;font-weight:900}.title{font-family:'Noto Serif KR',serif;font-size:55px;font-weight:900;line-height:1.08;margin-top:18px}.highlight{font-size:35px;color:#ffd21c;font-weight:900;margin-top:5px}.date{font-size:24px;color:#ffd21c;font-weight:900;margin-top:18px}.venue{font-size:15px;font-weight:900;margin-top:5px}.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.box{background:rgba(3,14,34,.82);border:1px solid #e2bd4e;border-radius:9px;padding:12px;text-align:left;min-height:120px}.box h3{text-align:center;color:#ffd21c;margin:0 0 10px;font-size:15px}.box p{font-size:10px;line-height:1.55;margin:4px 0}.performers{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:14px}.person{background:rgba(0,0,0,.78);border:1px solid #ffd21c;border-radius:5px;overflow:hidden}.person img{width:100%;height:58px;object-fit:cover;display:block}.person span{display:block;font-size:8px;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{position:absolute;left:20px;right:20px;bottom:16px;border-top:1px solid #d7b24f;padding-top:8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="poster"><img class="bg" id="bg"><div class="shade"></div><div class="content"><div class="headline">행사 홍보</div><div class="title" id="title">행사 제목</div><div class="highlight" id="highlight">특별공연</div><div class="date" id="date">2026. 08. 28. · 18:00~22:00</div><div class="venue" id="venue">행사 장소</div><div class="boxes"><div class="box"><h3>행사 프로그램</h3><p>먹거리 · 볼거리 · 즐길거리</p><p>지역 예술공연 · 시민 참여</p></div><div class="box"><h3>함께하는 무대</h3><p>주최 · 주관 특별공연</p><p>많은 관심과 참여 부탁드립니다!</p></div></div><div class="performers" id="performers"></div><div class="footer" id="footer">주최 · 주관 · 행사 안내</div></div></div></body></html>
