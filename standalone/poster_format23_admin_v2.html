<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>② 행사형 · ③ 축제형 관리자 V2</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{display:flex;min-height:100vh}.side{width:430px;padding:18px;background:#111c2c;overflow:auto}.side h2{margin:0 0 6px}.hint{font-size:11px;color:#aeb9ca;line-height:1.45}.sec{border-top:1px solid #30415b;margin-top:14px;padding-top:12px}.sec h3{margin:0 0 8px;color:#ffd21c;font-size:15px}.form{display:grid;gap:7px}.form input,.form textarea{width:100%;padding:9px;border:1px solid #40516a;border-radius:6px;background:#091426;color:#fff;font-size:12px}.form textarea{min-height:55px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lab{font-size:11px;color:#ffd21c;font-weight:900;display:block;margin-bottom:4px}.formats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.formats button,.btn{padding:10px;border:1px solid #40516a;border-radius:7px;background:#17243a;color:#fff;font-weight:900;cursor:pointer}.formats button.active{background:#ffd21c;color:#111}.btn{width:100%;margin-top:7px;background:#1877d8}.btn.yellow{background:#ffd21c;color:#111}.cardEdit{padding:8px;border:1px solid #33445f;border-radius:7px;background:#0b1627;margin-bottom:6px}.cardEdit input{margin-bottom:5px}.cardEdit textarea{min-height:52px}.personEdit{padding:7px;border:1px solid #33445f;border-radius:7px;background:#0b1627;margin-bottom:6px}.personEdit input{margin-bottom:5px}.personEdit .del{float:right;background:#8d2020;color:#fff;border:0;border-radius:4px;padding:3px 6px}.thumb{width:48px;height:48px;object-fit:cover;display:none}.view{flex:1;background:#03060b;display:flex;justify-content:center;padding:20px}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#061426;box-shadow:0 0 30px #000}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.08),rgba(0,0,0,.82))}.canvas{position:absolute;inset:0;padding:25px;text-align:center;z-index:2;text-shadow:2px 3px 5px #000}.hidden{display:none}.top{font-size:13px;color:#ffd978;font-weight:900}.title{font-family:'Noto Serif KR',serif;font-size:58px;line-height:1.02;font-weight:900;margin-top:13px;letter-spacing:-2px}.hi{font-size:43px;color:#ffd21c;font-weight:900;margin-top:4px}.venue{font-size:15px;font-weight:900;margin-top:8px}.date{font-size:25px;color:#ffd21c;font-weight:900;margin-top:15px}.two{position:absolute;left:25px;right:25px;top:350px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:rgba(0,0,0,.72);border:1px solid #d4ab54;border-radius:8px;padding:10px;text-align:left;min-height:112px}.box h4{color:#ffd21c;text-align:center;margin:0 0 7px;font-size:13px}.box p{font-size:9px;margin:3px 0;line-height:1.4}.peopleTitle{position:absolute;left:25px;right:25px;top:490px;color:#ffd21c;font-weight:900}.people{position:absolute;left:25px;right:25px;top:517px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.person{background:#071225;border:1px solid #ffd21c;overflow:hidden}.person img,.blank{width:100%;height:65px;object-fit:cover;background:#151d2b;display:block}.person b{display:block;font-size:7px;padding:4px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{position:absolute;left:25px;right:25px;bottom:16px;border-top:1px solid #bd9445;padding-top:8px;font-size:9px}.festival .title{font-size:67px;color:#fff;text-shadow:4px 5px 0 #a31313,6px 7px 7px #000}.festival .hi{font-size:60px}.ribbon{margin:14px auto 8px;background:#c51d1d;border:2px solid #ffbd24;padding:9px;font-size:14px;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta div{background:rgba(0,0,0,.74);border:1px solid #ffd21c;border-radius:7px;padding:9px;font-size:10px}.festival .peopleTitle{top:340px}.festival .people{top:367px}.cards{position:absolute;left:25px;right:25px;bottom:67px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.card{background:rgba(255,255,255,.95);color:#111;text-shadow:none;border-radius:8px;padding:7px;min-height:91px}.card h4{font-size:11px;margin:0 0 6px}.card p{font-size:8px;margin:3px 0;line-height:1.3}.festival .foot{bottom:17px;background:#ffd21c;color:#142039;border:0;border-radius:18px;padding:7px;text-shadow:none;font-weight:900}@media(max-width:900px){.wrap{display:block}.side{width:100%}.view{min-height:100vh}.poster{transform:scale(.82);transform-origin:top center;margin-bottom:-170px}}</style></head><body><div class="wrap"><aside class="side"><h2>🎨 ② 행사형 · ③ 축제형</h2><div class="hint">기존 ① 관리자와 별개입니다. 아래에서 내용을 직접 수정하면 오른쪽 포스터에 즉시 반영됩니다.</div><div class="sec"><h3>포스터 형식</h3><div class="formats"><button id="b2" class="active">② 행사형</button><button id="b3">③ 축제형</button></div></div><div class="sec"><h3>행사 기본정보</h3><div class="form"><input id="top" value="우리 동네 특별행사" placeholder="상단 문구"><input id="title" value="행사 제목" placeholder="행사 제목"><input id="hi" value="특별공연" placeholder="강조 문구"><div class="row"><div><label class="lab">날짜</label><input id="date" type="date" value="2026-08-29"></div><div><label class="lab">시간</label><input id="time" type="time" value="19:00"></div></div><input id="dateAdd" placeholder="날짜 추가표시 (예: 8.29.(토)~30.(일))"><input id="timeAdd" placeholder="시간 추가표시 (예: 개막식 19:00~22:00)"><input id="venue" value="행사 장소" placeholder="장소"><div class="row"><input id="host" value="주최 기관" placeholder="주최"><input id="org" value="주관 기관" placeholder="주관"></div><input id="sub" value="먹거리 · 볼거리 · 즐길거리 가득한 행사!" placeholder="하단/리본 문구"><textarea id="program">먹거리 · 볼거리 · 즐길거리
지역 예술공연 · 시민 참여
가족 체험 프로그램</textarea><label class="lab">배경 이미지</label><input id="bgFile" type="file" accept="image/*"></div></div><div class="sec"><h3>축제형 4개 정보칸</h3><div class="hint">각 칸의 제목(바)과 아래 내용 2줄을 따로 수정합니다.</div><div class="cardEdit"><input id="t1" value="맛있는 먹거리"><textarea id="d1">지역농산물 판매
다양한 먹거리</textarea></div><div class="cardEdit"><input id="t2" value="신나는 공연"><textarea id="d2">주민공연
초청공연</textarea></div><div class="cardEdit"><input id="t3" value="즐길거리 가득"><textarea id="d3">플리마켓
체험부스</textarea></div><div class="cardEdit"><input id="t4" value="특별 이벤트"><textarea id="d4">상품권 증정
현장 참여</textarea></div></div><div class="sec"><h3>출연자 관리 (최대 7명)</h3><button class="btn" id="add">＋ 출연자 추가</button><div id="plist"></div></div><div class="sec"><button class="btn yellow" id="save">⬇ 현재 포스터 PNG 저장</button></div></aside><main class="view"><div class="poster"><img id="bg" class="bg"><div class="shade"></div><section id="p2" class="canvas"><div class="top" id="vtop"></div><div class="title" id="vtitle"></div><div class="hi" id="vhi"></div><div class="venue" id="vvenue"></div><div class="date" id="vdate"></div><div class="two"><div class="box"><h4>행사 프로그램</h4><div id="vprog"></div></div><div class="box"><h4>행사 안내</h4><p id="vhost"></p><p id="vorg"></p><p id="vtime"></p><p id="vsub"></p></div></div><div class="peopleTitle">출연진</div><div id="pp2" class="people"></div><div id="foot2" class="foot"></div></section><section id="p3" class="canvas festival hidden"><div class="top" id="vtop3"></div><div class="title" id="vtitle3"></div><div class="hi" id="vhi3"></div><div class="ribbon" id="vribbon"></div><div class="meta"><div id="vdate3"></div><div id="vvenue3"></div></div><div class="peopleTitle">출연진</div><div id="pp3" class="people"></div><div id="cards" class="cards"></div><div id="foot3" class="foot"></div></section></div></main></div><script>const $=id=>document.getElementById(id);let mode=2,people=[];function clean(s){return String(s||'').replace(/[&<>]/g,'')}function displayDate(){let d=$('date').value;let extra=$('dateAdd').value.trim();if(!d)return extra;let [y,m,day]=d.split('-');return extra||`${y}. ${Number(m)}. ${Number(day)}.`}function displayTime(){return $('timeAdd').value.trim()||$('time').value}function peopleHTML(){return people.map(p=>`<div class="person">${p.src?`<img src="${p.src}">`:'<div class="blank"></div>'}<b>${clean(p.name||'출연가수')}</b></div>`).join('')}function render(){let date=displayDate(),time=displayTime();$('vtop').textContent=$('top').value;$('vtitle').textContent=$('title').value;$('vhi').textContent=$('hi').value;$('vvenue').textContent=$('venue').value;$('vdate').textContent=date+' · '+time;$('vprog').innerHTML=clean($('program').value).split(/\r?\n/).map(x=>`<p>${x}</p>`).join('');$('vhost').textContent='주최 : '+$('host').value;$('vorg').textContent='주관 : '+$('org').value;$('vtime').textContent=time;$('vsub').textContent=$('sub').value;$('foot2').innerHTML='주최 : '+clean($('host').value)+'<br>주관 : '+clean($('org').value);$('vtop3').textContent=$('top').value;$('vtitle3').textContent=$('title').value;$('vhi3').textContent=$('hi').value;$('vribbon').textContent=$('sub').value;$('vdate3').textContent=date+' · '+time;$('vvenue3').textContent='📍 '+$('venue').value;$('foot3').innerHTML='주최 : '+clean($('host').value)+'<br>주관 : '+clean($('org').value);$('pp2').innerHTML=peopleHTML();$('pp3').innerHTML=peopleHTML();let arr=[['t1','d1'],['t2','d2'],['t3','d3'],['t4','d4']];$('cards').innerHTML=arr.map(a=>`<div class="card"><h4>${clean($(a[0]).value)}</h4>`+clean($(a[1]).value).split(/\r?\n/).map(x=>`<p>${x}</p>`).join('')+'</div>').join('');$('p2').classList.toggle('hidden',mode!==2);$('p3').classList.toggle('hidden',mode!==3)}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',render));document.querySelectorAll('input[type=date],input[type=time]').forEach(e=>e.addEventListener('change',render));$('b2').onclick=()=>{mode=2;$('b2').classList.add('active');$('b3').classList.remove('active');render()};$('b3').onclick=()=>{mode=3;$('b3').classList.add('active');$('b2').classList.remove('active');render()};$('bgFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('bg').src=r.result};r.readAsDataURL(f)};$('add').onclick=()=>{if(people.length>=7)return;let i=people.length;people.push({name:'출연가수',src:''});build();};function build(){let box=$('plist');box.innerHTML='';people.forEach((p,i)=>{let d=document.createElement('div');d.className='personEdit';d.innerHTML=`<button class="del" type="button">삭제</button><label class="lab">출연자 ${i+1}</label><input value="${clean(p.name)}"><input type="file" accept="image/*"><img class="thumb">`;let name=d.querySelector('input');let file=d.querySelectorAll('input')[1];let img=d.querySelector('.thumb');name.oninput=()=>{people[i].name=name.value;render()};file.onchange=()=>{let f=file.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{people[i].src=r.result;img.src=r.result;img.style.display='block';render()};r.readAsDataURL(f)};d.querySelector('.del').onclick=()=>{people.splice(i,1);build();render()};if(p.src){img.src=p.src;img.style.display='block'}box.appendChild(d)})}$('save').onclick=()=>{alert('PNG 저장 기능은 디자인 확정 후 연결합니다.');};for(let i=0;i<7;i++)$('add').click();render();</script></body></html>
