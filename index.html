<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행사 포스터 · 관리자</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05080e;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{display:flex;min-height:100vh}
.side{width:450px;padding:18px;background:#101b2b;overflow:auto}
.side h2{margin:0 0 7px}.hint{font-size:11px;color:#aab5c5;line-height:1.55}
.section{margin-top:16px;padding-top:14px;border-top:1px solid #30415b}.section h3{margin:0 0 10px;font-size:15px;color:#ffd21c}
.form{display:grid;gap:8px}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #3c4c65;border-radius:6px;background:#0a1424;color:#fff;font-size:12px}.form textarea{min-height:55px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.cat{border:1px solid #40506a;background:#172235;color:#dce5f2;border-radius:20px;padding:7px 10px;font-size:11px;cursor:pointer}.cat.active{background:#ffd21c;color:#111;border-color:#ffd21c;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:2px solid #34445c;border-radius:8px;overflow:hidden;cursor:pointer;background:#172235}.card.active{border-color:#ffd21c;box-shadow:0 0 0 1px #ffd21c}.card img{width:100%;height:110px;object-fit:cover;display:block}.card b{display:block;padding:8px;text-align:center;font-size:11px}
.apply{width:100%;margin-top:12px;padding:14px;border:0;border-radius:7px;background:#1877d8;color:#fff;font-weight:900;cursor:pointer}.status{margin-top:8px;color:#ffd21c;font-size:12px}
.add{width:100%;padding:11px;border:1px solid #ffd21c;border-radius:7px;background:#18243a;color:#ffd21c;font-weight:900;cursor:pointer;margin-bottom:10px}
.performer{padding:10px;border:1px solid #33445f;border-radius:8px;background:#0c1627;margin-bottom:8px}.performerTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11px;color:#dfe7f2}.remove{border:0;background:#7d1f2a;color:#fff;border-radius:5px;padding:5px 8px;cursor:pointer}.performer input[type=text]{margin-bottom:6px}.performer input[type=file]{font-size:10px}.mainpick{font-size:10px;color:#ffd21c;display:flex;align-items:center;gap:5px;margin-top:7px}.thumb{width:55px;height:55px;object-fit:cover;border-radius:5px;border:1px solid #555;margin-top:6px;display:none}
.view{flex:1;display:flex;justify-content:center;padding:20px;background:#03060b}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#08152e;box-shadow:0 0 30px #000}.poster img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.12),rgba(0,5,20,.12) 45%,rgba(0,5,20,.72));z-index:2}
.txt{position:absolute;z-index:3;left:20px;right:20px;text-align:center;text-shadow:2px 3px 5px #000}.t1{top:25px;color:#ffe27b;font-size:15px}.t2{top:80px;font-size:48px;font-weight:900}.t3{top:145px;color:#ffd21c;font-size:55px;font-weight:900}.place{top:215px;font-size:19px;font-weight:700}
/* 참고 포스터와 같은 구조: 출연자 영역은 고정된 상·하한 사이에서만 사용하고, 하단 정보는 항상 포스터 바닥에 고정 */
.performersTitle{position:absolute;z-index:4;left:40px;right:40px;top:455px;height:42px;background:#1f397d;border:1px solid #ffd21c;text-align:center;padding:10px;font-size:17px;font-weight:900}
.artistArea{position:absolute;z-index:5;left:18px;right:18px;top:510px;bottom:190px;overflow:hidden}
.artistGrid{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:72px;gap:4px;align-content:start}
.artistCard{height:72px;background:rgba(0,0,0,.8);border:2px solid #ffd21c;min-width:0;text-align:center;overflow:hidden}.artistCard img{width:100%;height:50px;object-fit:cover;display:block}.artistCard .name{font-size:9px;padding:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mainArtist{position:absolute;z-index:7;right:18px;top:155px;width:155px;height:260px;border:3px solid #ffd21c;border-radius:80px 80px 20px 20px;overflow:hidden;background:rgba(0,0,0,.75);display:none}.mainArtist img{width:100%;height:100%;object-fit:cover}.mainLabel{position:absolute;left:0;right:0;bottom:0;background:rgba(7,16,30,.94);color:#ffd21c;border-top:1px solid #ffd21c;padding:6px 5px;font-size:12px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{position:absolute;z-index:9;left:20px;right:20px;bottom:20px;height:145px;padding:14px;text-align:center;background:rgba(0,0,0,.9);line-height:1.6;font-size:14px;display:flex;flex-direction:column;justify-content:center}
.mark{position:absolute;z-index:10;left:10px;top:10px;color:#ffd21c;background:rgba(0,0,0,.82);border:1px solid #ffd21c;border-radius:4px;padding:5px;font-size:9px}
@media(max-width:850px){.wrap{display:block}.side{width:100%}.view{min-height:100vh}.poster{width:92vw;height:163.55vw;max-width:540px;max-height:960px}}
</style>
</head>
<body>
<div class="wrap">
<aside class="side">
<h2>🎨 행사 포스터 관리자</h2>
<p class="hint">행사 정보와 출연자를 입력하면 오른쪽 포스터에 즉시 반영됩니다.</p>
<div class="section"><h3>① 행사 기본정보</h3><div class="form">
<input id="headline" placeholder="상단 문구" value="순천의 밤을 빛내는 특별한 무대!">
<input id="title" placeholder="행사 제목" value="아랫장 야시장">
<input id="highlight" placeholder="강조 문구" value="특별공연">
<input id="venue" placeholder="장소" value="순천 아랫장 야시장 특별무대">
<input id="date" placeholder="날짜" value="2026. 08. 28(금) 19:00">
<input id="time" placeholder="시간" value="오후 7시 ~ 10시">
<select id="host"><option value="">주최 없음</option><option value="가수인생활 엔터테인먼트">가수인생활 엔터테인먼트</option><option value="직접 입력">직접 입력</option></select>
<input id="hostCustom" placeholder="주최 직접 입력" style="display:none">
<select id="organizer"><option value="">주관 없음</option><option value="가수인생활 엔터테인먼트" selected>가수인생활 엔터테인먼트</option><option value="직접 입력">직접 입력</option></select>
<input id="organizerCustom" placeholder="주관 직접 입력" style="display:none">
<textarea id="desc" placeholder="행사 설명"></textarea>
</div></div>
<div class="section"><h3>② 행사별 배경 디자인</h3><div class="cats" id="cats"></div><div class="grid" id="grid"></div><button class="apply" id="applyBtn">⬇ 선택한 디자인 포스터에 적용</button><div class="status" id="status">현재 선택: 없음</div></div>
<div class="section"><h3>③ 출연자 관리</h3><p class="hint">한 칸에 직책과 이름을 바로 입력합니다. 예: 가수 이명로, 단장 박세경, 사회자 김영희.</p><button class="add" id="addBtn">＋ 출연자 추가</button><div id="performers"></div></div>
</aside>
<main class="view"><div class="poster">
<img class="bg" id="bg" alt="선택한 행사 배경"><div class="shade"></div>
<div class="txt t1" id="pHeadline"></div><div class="txt t2" id="pTitle"></div><div class="txt t3" id="pHighlight"></div><div class="txt place" id="pVenue"></div>
<div class="performersTitle">출 연 자 소 개</div>
<div class="artistArea"><div class="artistGrid" id="artistGrid"></div></div>
<div class="mainArtist" id="mainArtist"><img id="mainImg"><div class="mainLabel" id="mainLabel"></div></div>
<div class="info" id="pInfo"></div><div class="mark" id="mark"></div>
</div></main></div>
<script>
const D=[
['night','야시장','🌙 야시장 · 전구조명 · 시장거리','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80'],
['night','야시장','🏮 전통시장 · 야간거리 · 상점','https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80'],
['night','야시장','✨ 야간행사 · 골드조명 · 거리','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80'],
['concert','공연','🎤 공연무대 · 조명 · 관객','https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=900&q=80'],
['concert','공연','💜 퍼플 무대 · 관객 · 콘서트','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80'],
['festival','축제','🎉 축제현장 · 야외공연 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'],
['festival','축제','🎆 불꽃축제 · 밤하늘 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'],
['sports','체육대회','🏃 운동장 · 선수 · 응원석','https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80'],
['sports','체육대회','🏅 스포츠행사 · 경기장 · 관중','https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80'],
['golf','골프대회','⛳ 골프장 · 필드 · 대회','https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=900&q=80'],
['golf','골프대회','🏆 골프대회 · 시상식 분위기','https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=900&q=80'],
['local','지역특산물','🌶️ 지역특산물 · 먹거리 · 장터','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80'],
['local','지역특산물','🍎 농특산물 · 직거래장터 · 지역축제','https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=900&q=80'],
['market','시장행사','🛍️ 시장행사 · 상점 · 사람들','https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=900&q=80'],
['general','일반행사','🌟 고급행사 · 무대 · 야간조명','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80']
];
const C=[['all','전체'],['night','🌙 야시장'],['concert','🎤 공연'],['festival','🎉 축제'],['sports','🏃 체육대회'],['golf','⛳ 골프대회'],['local','🌶️ 지역특산물'],['market','🛍️ 시장행사'],['general','✨ 일반행사']];
let category='all',sel=null,performers=[];
const $=id=>document.getElementById(id),grid=$('grid'),cats=$('cats'),bg=$('bg');
function selectedValue(id,customId){const v=$(id).value;return v==='직접 입력'?$(customId).value:v}
function updateText(){
$('pHeadline').textContent=$('headline').value;$('pTitle').textContent=$('title').value;$('pHighlight').textContent=$('highlight').value;$('pVenue').textContent=$('venue').value;
const h=selectedValue('host','hostCustom'),o=selectedValue('organizer','organizerCustom');
$('pInfo').innerHTML=$('date').value+'<br>'+$('time').value+(h?'<br>주최: '+h:'')+(o?'<br>주관: '+o:'')+($('desc').value?'<br><small>'+escapeHtml($('desc').value)+'</small>':'');
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toggleCustom(id,customId){$(customId).style.display=$(id).value==='직접 입력'?'block':'none';updateText()}
function renderCats(){cats.innerHTML='';C.forEach(x=>{const b=document.createElement('button');b.className='cat'+(category===x[0]?' active':'');b.textContent=x[1];b.onclick=()=>{category=x[0];renderCats();render()};cats.appendChild(b)})}
function render(){grid.innerHTML='';D.filter(x=>category==='all'||x[0]===category).forEach(x=>{const c=document.createElement('div');c.className='card'+(sel===x[2]?' active':'');c.innerHTML='<img src="'+x[3]+'"><b>'+x[2]+'</b>';c.onclick=()=>{sel=x[2];render();apply()};grid.appendChild(c)})}
function apply(){if(!sel)return;const x=D.find(v=>v[2]===sel);bg.src=x[3];$('status').textContent='현재 적용: '+x[2];$('mark').textContent='적용됨: '+x[2]}
function addPerformer(){performers.push({id:Date.now()+Math.random(),text:'',src:'',main:performers.length===0});renderPerformers()}
function removePerformer(id){performers=performers.filter(p=>p.id!==id);if(performers.length&&!performers.some(p=>p.main))performers[0].main=true;renderPerformers()}
function renderPerformers(){
const box=$('performers');box.innerHTML='';
performers.forEach((p,i)=>{const el=document.createElement('div');el.className='performer';el.innerHTML='<div class="performerTop"><b>출연자 '+(i+1)+'</b><button class="remove" type="button">삭제</button></div><input type="text" placeholder="가수 이명로" value="'+escapeHtml(p.text)+'"><input type="file" accept="image/*"><label class="mainpick"><input type="radio" name="mainArtist" '+(p.main?'checked':'')+'> 메인 표시</label><img class="thumb" '+(p.src?'src="'+p.src+'" style="display:block"':'')+'>';
const text=el.querySelector('input[type=text]');text.oninput=e=>{p.text=e.target.value;renderPoster()};el.querySelector('.remove').onclick=()=>removePerformer(p.id);el.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{p.src=r.result;renderPerformers();renderPoster()};r.readAsDataURL(f)};el.querySelector('input[type=radio]').onchange=()=>{performers.forEach(q=>q.main=false);p.main=true;renderPerformers();renderPoster()};box.appendChild(el)})
renderPoster()
}
function renderPoster(){
const g=$('artistGrid');g.innerHTML='';
performers.filter(p=>!p.main).forEach(p=>{const c=document.createElement('div');c.className='artistCard';c.innerHTML=(p.src?'<img src="'+p.src+'">':'<div style="height:50px;background:#151515"></div>')+'<div class="name">'+escapeHtml(p.text||'출연가수')+'</div>';g.appendChild(c)});
const main=performers.find(p=>p.main);const ma=$('mainArtist');if(main){ma.style.display='block';$('mainImg').src=main.src||'';$('mainLabel').textContent=main.text||'메인가수'}else ma.style.display='none';
}
$('addBtn').onclick=addPerformer;$('applyBtn').onclick=apply;
['headline','title','highlight','venue','date','time','desc'].forEach(id=>$(id).addEventListener('input',updateText));
$('host').onchange=()=>toggleCustom('host','hostCustom');$('organizer').onchange=()=>toggleCustom('organizer','organizerCustom');$('hostCustom').oninput=updateText;$('organizerCustom').oninput=updateText;
renderCats();render();updateText();addPerformer();
</script>
</body>
</html>
