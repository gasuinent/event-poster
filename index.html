<div class="wrap">
<aside class="side">
<h2>🎨 행사 포스터 관리자</h2>
<p class="hint">행사 정보와 출연자를 입력하면 오른쪽 포스터에 즉시 반영됩니다.</p>
<div class="section"><h3>① 행사 기본정보</h3><div class="form">
<input id="headline" placeholder="상단 문구" value="순천의 밤을 빛내는 특별한 무대!">
<input id="title" placeholder="행사 제목" value="아랫장 야시장">
<input id="highlight" placeholder="강조 문구" value="특별공연">
<label class="fieldLabel">일 시</label><div class="dateFields"><input id="date" type="date" value="2026-08-28"><input id="time" placeholder="시간" value="18:00~22:00"></div>
<label class="fieldLabel">장 소</label><input id="venue" placeholder="장소" value="순천 아랫장 야시장 특별무대">
<label class="fieldLabel">주 최</label><select id="host"><option value="">주최 없음</option><option value="가수인생활 엔터테인먼트">가수인생활 엔터테인먼트</option><option value="직접 입력">직접 입력</option></select>
<input id="hostCustom" placeholder="주최 직접 입력" style="display:none">
<label class="fieldLabel">주 관</label><select id="organizer"><option value="">주관 없음</option><option value="가수인생활 엔터테인먼트" selected>가수인생활 엔터테인먼트</option><option value="직접 입력">직접 입력</option></select>
<input id="organizerCustom" placeholder="주관 직접 입력" style="display:none">
<div class="bottomFields"><label>하단 문구 ①</label><input id="bottomMsg1" placeholder="아랫장야시장에서 만나요!"><label>하단 문구 ②</label><input id="bottomMsg2" placeholder="많은 관심과 참여 부탁드립니다!"></div>
</div></div>
<div class="section"><h3>② 행사별 배경 디자인</h3><div class="cats" id="cats"></div><div class="grid" id="grid"></div><button class="apply" id="applyBtn">⬇ 선택한 디자인 포스터에 적용</button><div class="status" id="status">현재 선택: 없음</div></div>
<div class="section"><h3>③ 출연자 관리</h3><p class="hint">한 칸에 직책과 이름을 바로 입력합니다. 예: 가수 이명로, 단장 박세경, 사회자 김영희.</p><button class="add" id="addBtn">＋ 출연자 추가</button><div id="performers"></div></div>
</aside>
<main class="view"><div class="poster">
<img class="bg" id="bg" alt="선택한 행사 배경"><div class="shade"></div>
<div class="txt t1" id="pHeadline"></div><div class="txt t2" id="pTitle"></div><div class="txt t3" id="pHighlight"></div><div class="txt place" id="pVenue"></div>
<div class="performersTitle">출 연 자 소 개</div>
<div class="artistArea"><div class="artistGrid" id="artistGrid"></div></div>
<div class="mainArtist" id="mainArtist"><img id="mainImg"><div class="mainLabel" id="mainLabel"></div></div>
<div class="info" id="pInfo"></div><div class="infoInvite" id="infoInvite"></div><div class="posterFooter" id="posterFooter"></div><div class="mark" id="mark"></div>
</div></main></div>

['general','일반행사','🎭 문화행사 · 공연장 · 관객','https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=900&q=80'],
['general','일반행사','🎤 시민행사 · 야외무대 · 관객','https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=900&q=80'],
['general','일반행사','🌃 야간행사 · 도시조명 · 무대','https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80'],
['general','일반행사','🎉 기념행사 · 축하무대 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80']
];
const C=[['all','전체'],['night','🌙 야시장'],['concert','🎤 공연'],['festival','🎉 축제'],['sports','🏃 체육대회'],['golf','⛳ 골프대회'],['local','🌶️ 지역특산물'],['market','🛍️ 시장행사'],['general','✨ 일반행사']];
let category='all',sel=null,performers=[];
const $=id=>document.getElementById(id),grid=$('grid'),cats=$('cats'),bg=$('bg');
function selectedValue(id,customId){const v=$(id).value;return v==='직접 입력'?$(customId).value:v}
function escapeHtml(s){return s.replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatInvite(s){if(!s)return '';const e=escapeHtml(s);return s==='많은 관심과 참여 부탁드립니다!'?'많은 관심과<br><span class="accent">참여</span> 부탁드립니다!':e.replace(/참여/g,'<span class="accent">참여</span>')}
function formatDate(v){if(!v)return '';const p=v.split('-');if(p.length!==3)return v;const d=new Date(v+'T00:00:00');const days=['일','월','화','수','목','금','토'];return p[0]+'. '+p[1]+'. '+p[2]+'('+days[d.getDay()]+')'}
function formatTimePart(part){const s=part.trim();if(!s)return '';if(/^\d{3,4}$/.test(s)){const n=s.padStart(4,'0');return n.slice(0,2)+':'+n.slice(2)}const m=s.match(/^(\d{1,2}):?(\d{2})$/);if(m)return m[1].padStart(2,'0')+':'+m[2];return s}
function normalizeTime(v){if(!v)return '';let s=v.trim().replace(/[～〜]/g,'~').replace(/\s+/g,'');const digits=s.replace(/\D/g,'');if(digits.length===8)return digits.slice(0,2)+':'+digits.slice(2,4)+'~'+digits.slice(4,6)+':'+digits.slice(6,8);return s.replace(/(~~|~)/g,(_,sep)=>'§'+sep+'§').split('§').map((part,i)=>i%2===0?formatTimePart(part):part).join('')}
function updateText(){
$('pHeadline').textContent=$('headline').value;$('pTitle').textContent=$('title').value;$('pHighlight').textContent=$('highlight').value;$('pVenue').textContent=$('venue').value;
const h=selectedValue('host','hostCustom'),o=selectedValue('organizer','organizerCustom');
const rows=[];rows.push('<div class="infoRow"><span class="infoIcon">📅</span><span class="infoLabel">일 시</span><span class="infoValue">'+escapeHtml(formatDate($('date').value))+( $('time').value ? ' · '+escapeHtml(normalizeTime($('time').value)) : '' )+'</span></div>');rows.push('<div class="infoRow"><span class="infoIcon">📍</span><span class="infoLabel">장 소</span><span class="infoValue">'+escapeHtml($('venue').value)+'</span></div>');if(h)rows.push('<div class="infoRow"><span class="infoIcon">👥</span><span class="infoLabel">주 최</span><span class="infoValue">'+escapeHtml(h)+'</span></div>');if(o)rows.push('<div class="infoRow"><span class="infoIcon">📣</span><span class="infoLabel">주 관</span><span class="infoValue">'+escapeHtml(o)+'</span></div>');$('pInfo').innerHTML=rows.join('');
$('posterFooter').innerHTML=$('bottomMsg1').value?'<span class="star">☆</span>'+escapeHtml($('bottomMsg1').value)+'<span class="music">♪</span>':'';$('infoInvite').innerHTML=formatInvite($('bottomMsg2').value);
}
function toggleCustom(id,customId){$(customId).style.display=$(id).value==='직접 입력'?'block':'none';updateText()}
function renderCats(){cats.innerHTML='';C.forEach(x=>{const b=document.createElement('button');b.className='cat'+(category===x[0]?' active':'');b.textContent=x[1];b.onclick=()=>{category=x[0];renderCats();render()};cats.appendChild(b)})}
function render(){grid.innerHTML='';D.filter(x=>category==='all'||x[0]===category).forEach(x=>{const c=document.createElement('div');c.className='card'+(sel===x[2]?' active':'');c.innerHTML='<img src="'+x[3]+'"><b>'+x[2]+'</b>';c.onclick=()=>{sel=x[2];render();apply()};grid.appendChild(c)})}
function apply(){if(!sel)return;const x=D.find(v=>v[2]===sel);bg.src=x[3];$('status').textContent='현재 적용: '+x[2];$('mark').textContent='적용됨: '+x[2]}
function addPerformer(){performers.push({id:Date.now()+Math.random(),text:'',src:'',main:performers.length===0});renderPerformers()}
function removePerformer(id){performers=performers.filter(p=>p.id!==id);if(performers.length&&!performers.some(p=>p.main))performers[0].main=true;renderPerformers()}
function renderPerformers(){
const box=$('performers');box.innerHTML='';
performers.forEach((p,i)=>{const el=document.createElement('div');el.className='performer';el.innerHTML='<div class="performerTop"><b>출연자 '+(i+1)+'</b><button class="remove" type="button">삭제</button></div><input type="text" placeholder="가수 이명로" value="'+escapeHtml(p.text)+'"><input type="file" accept="image/*"><label class="mainpick"><input type="radio" name="mainArtist" '+(p.main?'checked':'')+'> 메인 표시</label><img class="thumb" '+(p.src?'src="'+p.src+'" style="display:block"':'')+'>';
const text=el.querySelector('input[type=text]');text.oninput=e=>{p.text=e.target.value;renderPoster()};el.querySelector('.remove').onclick=()=>removePerformer(p.id);el.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{p.src=r.result;renderPerformers();renderPoster()};r.readAsDataURL(f)};el.querySelector('input[type=radio]').onchange=()=>{performers.forEach(q=>q.main=false);p.main=true;renderPerformers();renderPoster()};box.appendChild(el)})
renderPoster()
}
function renderPoster(){
const g=$('artistGrid');g.innerHTML='';
performers.filter(p=>!p.main).forEach(p=>{const c=document.createElement('div');c.className='artistCard';c.innerHTML=(p.src?'<img src="'+p.src+'">':'<div style="height:50px;background:#151515"></div>')+'<div class="name">'+escapeHtml(p.text||'출연가수')+'</div>';g.appendChild(c)});
const main=performers.find(p=>p.main);const ma=$('mainArtist');if(main){ma.style.display='block';$('mainImg').src=main.src||'';$('mainLabel').textContent=main.text||'메인가수'}else ma.style.display='none';
}
$('addBtn').onclick=addPerformer;$('applyBtn').onclick=apply;
['headline','title','highlight','venue','date','bottomMsg1','bottomMsg2'].forEach(id=>$(id).addEventListener('input',updateText));
$('time').addEventListener('input',e=>{const v=e.target.value;const digits=v.replace(/\D/g,'');if(digits.length===8){e.target.value=digits.slice(0,2)+':'+digits.slice(2,4)+'~'+digits.slice(4,6)+':'+digits.slice(6,8)}else if(digits.length>8){const d=digits.slice(0,8);e.target.value=d.slice(0,2)+':'+d.slice(2,4)+'~'+d.slice(4,6)+':'+d.slice(6,8)}updateText()});
$('time').addEventListener('blur',e=>{e.target.value=normalizeTime(e.target.value);updateText()});$('time').addEventListener('change',e=>{e.target.value=normalizeTime(e.target.value);updateText()});
$('host').onchange=()=>toggleCustom('host','hostCustom');$('organizer').onchange=()=>toggleCustom('organizer','organizerCustom');$('hostCustom').oninput=updateText;$('organizerCustom').oninput=updateText;
$('bottomMsg1').value='☆ 아랫장야시장에서 만나요!';$('bottomMsg2').value='많은 관심과 참여 부탁드립니다!';
renderCats();render();updateText();addPerformer();
</script>
</body>
</html>
