<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>행사 포스터 · 다양한 배경 디자인</title><style>*{box-sizing:border-box}body{margin:0;background:#05080e;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{display:flex;min-height:100vh}.side{width:410px;padding:20px;background:#101b2b;overflow:auto}.side h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:2px solid #34445c;border-radius:8px;overflow:hidden;cursor:pointer;background:#172235;transition:.15s}.card:hover{transform:translateY(-2px)}.card.active{border-color:#ffd21c;box-shadow:0 0 0 1px #ffd21c}.card img{width:100%;height:135px;object-fit:cover;display:block}.card b{display:block;padding:9px;text-align:center;font-size:12px}.apply{width:100%;margin-top:14px;padding:14px;border:0;border-radius:7px;background:#1877d8;color:#fff;font-weight:900;cursor:pointer}.status{margin-top:10px;color:#ffd21c;font-size:12px}.hint{font-size:11px;color:#9eacbf;line-height:1.6}.view{flex:1;display:flex;justify-content:center;padding:20px;background:#03060b}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#08152e;box-shadow:0 0 30px #000}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.08),rgba(0,5,20,.12) 45%,rgba(0,5,20,.52));z-index:2}.txt{position:absolute;z-index:3;left:20px;right:20px;text-align:center;text-shadow:2px 3px 5px #000}.t1{top:25px;color:#ffe27b;font-size:15px}.t2{top:80px;font-size:48px;font-weight:900}.t3{top:145px;color:#ffd21c;font-size:55px;font-weight:900}.info{position:absolute;z-index:3;bottom:35px;left:20px;right:20px;padding:18px;text-align:center;background:rgba(0,0,0,.65);line-height:1.7}.mark{position:absolute;z-index:5;left:10px;top:10px;color:#ffd21c;background:rgba(0,0,0,.8);border:1px solid #ffd21c;border-radius:4px;padding:5px;font-size:9px}@media(max-width:850px){.wrap{display:block}.side{width:100%}.view{min-height:100vh}.poster{width:92vw;height:163.55vw;max-width:540px;max-height:960px}}</style></head><body><div class="wrap"><aside class="side"><h2>🎨 배경 디자인 선택</h2><p class="hint">행사 종류에 맞는 <b>실사형 배경사진</b>을 선택합니다.<br><b style="color:#ffd21c">가수·출연자 사진은 배경에 포함하지 않습니다.</b></p><div class="grid" id="grid"></div><button class="apply" id="applyBtn">⬇ 선택한 디자인 포스터에 적용</button><div class="status" id="status">현재 선택: 없음</div></aside><main class="view"><div class="poster"><img id="bg" alt="선택한 행사 배경"><div class="shade"></div><div class="txt t1">대구 서부시장의 밤을 빛내는 특별한 무대!</div><div class="txt t2">서부시장 야시장</div><div class="txt t3">특별공연</div><div class="info">2026년 10월 9일(금) ~ 10일(토)<br>오후 7시 ~ 10시<br>대구 서부시장 야시장</div><div class="mark" id="mark"></div></div></main></div><script>const D=[
['market','🌙 야시장 · 전구조명 · 시장거리','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80'],
['stage','🎤 공연무대 · 조명 · 관객','https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=900&q=80'],
['festival','🎉 축제현장 · 야외공연 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'],
['sports','🏃 체육대회 · 운동장 · 응원석','https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80'],
['golf','⛳ 골프대회 · 필드 · 시상식 분위기','https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=900&q=80'],
['food','🌶️ 지역특산물 · 먹거리 · 장터','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80'],
['market2','🏮 전통시장 · 야간거리 · 상점','https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80'],
['fireworks','🎆 불꽃축제 · 밤하늘 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'],
['gold','✨ 고급 골드 · 야간행사 · 무대','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80']
];let sel=null;const grid=document.getElementById('grid'),bg=document.getElementById('bg'),status=document.getElementById('status'),mark=document.getElementById('mark');function render(){grid.innerHTML='';D.forEach(x=>{const c=document.createElement('div');c.className='card'+(sel===x[0]?' active':'');c.innerHTML='<img src="'+x[2]+'" loading="lazy"><b>'+x[1]+'</b>';c.onclick=()=>{sel=x[0];render();apply()};grid.appendChild(c)})}function apply(){if(!sel)return;const x=D.find(v=>v[0]===sel);bg.src=x[2];status.textContent='현재 적용: '+x[1];mark.textContent='적용됨: '+x[1]}document.getElementById('applyBtn').onclick=apply;render();</script></body></html>
