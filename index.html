<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>행사 포스터 1단계 테스트</title><style>body{margin:0;background:#0b1018;color:#fff;font-family:Arial,sans-serif}.wrap{display:flex;min-height:100vh}.side{width:340px;padding:20px;background:#101b2b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:2px solid #34445c;border-radius:7px;overflow:hidden;cursor:pointer}.card.active{border-color:#ffd21c}.card img{width:100%;height:130px;object-fit:cover;display:block}.card b{display:block;padding:8px;text-align:center;font-size:11px}.apply{width:100%;margin-top:12px;padding:12px;border:0;border-radius:6px;background:#1877d8;color:#fff;font-weight:900}.status{margin-top:10px;color:#ffd21c;font-size:11px}.view{flex:1;display:flex;justify-content:center;padding:25px;background:#05080e}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#08152e}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.05),rgba(0,5,20,.12) 45%,rgba(0,5,20,.55))}.txt{position:absolute;z-index:3;left:20px;right:20px;text-align:center;text-shadow:2px 3px 5px #000}.t1{top:25px;color:#ffe27b}.t2{top:80px;font-size:48px;font-weight:900}.t3{top:145px;color:#ffd21c;font-size:55px;font-weight:900}.info{position:absolute;z-index:3;bottom:35px;left:20px;right:20px;padding:18px;text-align:center;background:rgba(0,0,0,.65)}.mark{position:absolute;z-index:5;left:10px;bottom:10px;color:#ffd21c;background:#000b;padding:5px;font-size:9px}</style></head><body><div class="wrap"><aside class="side"><h2>🎨 1단계 · 배경 디자인</h2><p style="font-size:11px;color:#aab5c5">가수·출연자 사진 없이 야시장·무대·조명 배경만 확인합니다.</p><div class="grid" id="grid"></div><button class="apply" onclick="apply()">⬇ 선택한 디자인 포스터에 적용</button><div class="status" id="status">현재 선택: 없음</div></aside><main class="view"><div class="poster"><img id="bg"><div class="shade"></div><div class="txt t1">대구 서부시장의 밤을 빛내는 특별한 무대!</div><div class="txt t2">서부시장 야시장</div><div class="txt t3">특별공연</div><div class="info">2026년 10월 9일(금) ~ 10일(토)<br>오후 7시 ~ 10시<br>대구 서부시장 야시장</div><div class="mark" id="mark"></div></div></main></div><script>const D=[['real_market','야시장 + 무대 + 전구','assets/real_market.jpg'],['real_purple','퍼플 조명 야시장 + 무대','assets/real_purple.jpg'],['real_festival','축제 레드 조명 + 야시장','assets/real_festival.jpg'],['real_gold','골드 조명 야시장 + 무대','assets/real_gold.jpg']];let sel='';function render(){grid.innerHTML='';D.forEach(x=>{let c=document.createElement('div');c.className='card'+(sel===x[0]?' active':'');c.innerHTML='<img src="'+x[2]+'"><b>'+x[1]+'</b>';c.onclick=()=>{sel=x[0];render();apply()};grid.appendChild(c)})}function apply(){if(!sel)return;let x=D.find(v=>v[0]===sel);bg.src=x[2];status.textContent='현재 적용: '+x[1];mark.textContent='적용됨: '+x[1]}render();</script></body></html>
