<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>행사 포스터 · 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#05080e;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{display:flex;min-height:100vh}.side{width:450px;padding:18px;background:#101b2b;overflow:auto}.side h2{margin:0 0 7px}.hint{font-size:11px;color:#aab5c5;line-height:1.55}.section{margin-top:16px;padding-top:14px;border-top:1px solid #30415b}.section h3{margin:0 0 10px;font-size:15px;color:#ffd21c}.form{display:grid;gap:8px}.form input,.form textarea{width:100%;padding:10px;border:1px solid #3c4c65;border-radius:6px;background:#0a1424;color:#fff;font-size:12px}.form textarea{min-height:55px;resize:vertical}.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.cat{border:1px solid #40506a;background:#172235;color:#dce5f2;border-radius:20px;padding:7px 10px;font-size:11px;cursor:pointer}.cat.active{background:#ffd21c;color:#111;border-color:#ffd21c;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:2px solid #34445c;border-radius:8px;overflow:hidden;cursor:pointer;background:#172235}.card.active{border-color:#ffd21c;box-shadow:0 0 0 1px #ffd21c}.card img{width:100%;height:110px;object-fit:cover;display:block}.card b{display:block;padding:8px;text-align:center;font-size:11px}.apply{width:100%;margin-top:12px;padding:14px;border:0;border-radius:7px;background:#1877d8;color:#fff;font-weight:900;cursor:pointer}.status{margin-top:8px;color:#ffd21c;font-size:12px}.view{flex:1;display:flex;justify-content:center;padding:20px;background:#03060b}.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#08152e;box-shadow:0 0 30px #000}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.12),rgba(0,5,20,.12) 45%,rgba(0,5,20,.58));z-index:2}.txt{position:absolute;z-index:3;left:20px;right:20px;text-align:center;text-shadow:2px 3px 5px #000}.t1{top:25px;color:#ffe27b;font-size:15px}.t2{top:80px;font-size:48px;font-weight:900}.t3{top:145px;color:#ffd21c;font-size:55px;font-weight:900}.place{top:215px;font-size:19px;font-weight:700}.info{position:absolute;z-index:3;bottom:35px;left:20px;right:20px;padding:18px;text-align:center;background:rgba(0,0,0,.68);line-height:1.7;font-size:15px}.mark{position:absolute;z-index:5;left:10px;top:10px;color:#ffd21c;background:rgba(0,0,0,.82);border:1px solid #ffd21c;border-radius:4px;padding:5px;font-size:9px}@media(max-width:850px){.wrap{display:block}.side{width:100%}.view{min-height:100vh}.poster{width:92vw;height:163.55vw;max-width:540px;max-height:960px}}</style></head><body><div class="wrap"><aside class="side"><h2>🎨 행사 포스터 관리자</h2><p class="hint">기본정보를 입력하면 오른쪽 포스터에 즉시 반영됩니다.</p><div class="section"><h3>① 행사 기본정보</h3><div class="form"><input id="headline" placeholder="상단 문구" value="대구 서부시장의 밤을 빛내는 특별한 무대!"><input id="title" placeholder="행사 제목" value="서부시장 야시장"><input id="highlight" placeholder="강조 문구" value="특별공연"><input id="venue" placeholder="장소" value="대구 서부시장 야시장"><input id="date" placeholder="날짜" value="2026년 10월 9일(금) ~ 10일(토)"><input id="time" placeholder="시간" value="오후 7시 ~ 10시"><input id="host" placeholder="주최"><input id="organizer" placeholder="주관"><textarea id="desc" placeholder="행사 설명"></textarea></div></div><div class="section"><h3>② 행사별 배경 디자인</h3><div class="cats" id="cats"></div><div class="grid" id="grid"></div><button class="apply" id="applyBtn">⬇ 선택한 디자인 포스터에 적용</button><div class="status" id="status">현재 선택: 없음</div></div></aside><main class="view"><div class="poster"><img id="bg" alt="선택한 행사 배경"><div class="shade"></div><div class="txt t1" id="pHeadline"></div><div class="txt t2" id="pTitle"></div><div class="txt t3" id="pHighlight"></div><div class="txt place" id="pVenue"></div><div class="info" id="pInfo"></div><div class="mark" id="mark"></div></div></main></div><script>const D=[['night','야시장','🌙 야시장 · 전구조명 · 시장거리','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80'],['night','야시장','🏮 전통시장 · 야간거리 · 상점','https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80'],['night','야시장','✨ 야간행사 · 골드조명 · 거리','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80'],['concert','공연','🎤 공연무대 · 조명 · 관객','https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=900&q=80'],['concert','공연','💜 퍼플 무대 · 관객 · 콘서트','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80'],['festival','축제','🎉 축제현장 · 야외공연 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'],['festival','축제','🎆 불꽃축제 · 밤하늘 · 관객','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'],['sports','체육대회','🏃 운동장 · 선수 · 응원석','https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80'],['sports','체육대회','🏅 스포츠행사 · 경기장 · 관중','https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80'],['golf','골프대회','⛳ 골프장 · 필드 · 대회','https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=900&q=80'],['golf','골프대회','🏆 골프대회 · 시상식 분위기','https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=900&q=80'],['local','지역특산물','🌶️ 지역특산물 · 먹거리 · 장터','https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80'],['local','지역특산물','🍎 농특산물 · 직거래장터 · 지역축제','https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=900&q=80'],['market','시장행사','🛍️ 시장행사 · 상점 · 사람들','https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=900&q=80'],['general','일반행사','🌟 고급행사 · 무대 · 야간조명','https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80']];const C=[['all','전체'],['night','🌙 야시장'],['concert','🎤 공연'],['festival','🎉 축제'],['sports','🏃 체육대회'],['golf','⛳ 골프대회'],['local','🌶️ 지역특산물'],['market','🛍️ 시장행사'],['general','✨ 일반행사']];let category='all',sel=null;const $=id=>document.getElementById(id),grid=$('grid'),cats=$('cats'),bg=$('bg');function updateText(){ $('pHeadline').textContent=$('headline').value; $('pTitle').textContent=$('title').value; $('pHighlight').textContent=$('highlight').value; $('pVenue').textContent=$('venue').value; $('pInfo').innerHTML=$('date').value+'<br>'+$('time').value+($('host').value?'<br>주최: '+$('host').value:'')+($('organizer').value?'<br>주관: '+$('organizer').value:'')+($('desc').value?'<br><small>'+$('desc').value+'</small>':'') }function renderCats(){cats.innerHTML='';C.forEach(x=>{let b=document.createElement('button');b.className='cat'+(category===x[0]?' active':'');b.textContent=x[1];b.onclick=()=>{category=x[0];renderCats();render()};cats.appendChild(b)})}function render(){grid.innerHTML='';D.filter(x=>category==='all'||x[0]===category).forEach(x=>{let c=document.createElement('div');c.className='card'+(sel===x[2]?' active':'');c.innerHTML='<img src="'+x[3]+'"><b>'+x[2]+'</b>';c.onclick=()=>{sel=x[2];render();apply()};grid.appendChild(c)})}function apply(){if(!sel)return;let x=D.find(v=>v[2]===sel);bg.src=x[3];$('status').textContent='현재 적용: '+x[2];$('mark').textContent='적용됨: '+x[2]}['headline','title','highlight','venue','date','time','host','organizer','desc'].forEach(id=>$(id).addEventListener('input',updateText));$('applyBtn').onclick=apply;renderCats();render();updateText();</script></body></html>
