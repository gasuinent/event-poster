name: Add reliable main artist duplicate filter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DOM duplicate filter
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MAIN-ARTIST-DOM-FILTER -->'
          if marker not in s:
              patch='''\n<!-- MAIN-ARTIST-DOM-FILTER -->\n<script>\n(function(){\n  function clean(){\n    var main=document.getElementById('mainImg');\n    var grid=document.getElementById('artistGrid');\n    if(!main||!grid||!main.src)return;\n    var src=main.src;\n    grid.querySelectorAll('.artistCard').forEach(function(card){\n      var img=card.querySelector('img');\n      if(img && img.src===src) card.remove();\n    });\n  }\n  var grid=document.getElementById('artistGrid');\n  if(grid)new MutationObserver(clean).observe(grid,{childList:true,subtree:true});\n  var main=document.getElementById('mainImg');\n  if(main)new MutationObserver(clean).observe(main,{attributes:true,attributeFilter:['src']});\n  setTimeout(clean,100);setTimeout(clean,500);setTimeout(clean,1500);\n})();\n</script>\n'''
              p.write_text(s.replace('</body>',patch+'</body>',1),encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Filter main artist from performer cards' && git push)
          git rm -f .github/workflows/fix-main-artist-duplicate-2.yml || true
          git rm -f .github/poster-fix-trigger.txt || true
          git commit -m 'Remove temporary poster repair files' || true
          git push || true
