name: Restore original poster main artist layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original main artist display
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.mainArtist{display:none!important}'
          new = '.mainArtist{display:block!important}'
          if old not in s:
              raise SystemExit('Expected final main artist override was not found; no design changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-original-poster-layout.yml
          git rm .github/workflows/restore-original-poster-layout.yml
          git commit -m 'Restore original poster main artist layout'
          git push
