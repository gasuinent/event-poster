name: Apply reference poster design
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '시안 기준 디자인 적용 완료') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference based editable design
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')

          # 1) Make the poster use the reference-style photo background as an actual selectable image.
          #    Presets are remote photo URLs; uploaded local images still override them.
          marker='<label class="label">배경 이미지</label><input id="bgFile" type="file" accept="image/*">'
          if marker not in s:
              raise SystemExit('background control marker not found')
          controls='''<label class="label">배경 사진 · 행사별 디자인</label><input id="bgFile" type="file" accept="image/*"><div id="bgPresets" class="bgPresets"><button type="button" data-bg="market">🌃 야시장</button><button type="button" data-bg="stage">🎤 공연무대</button><button type="button" data-bg="lights">💡 전구조명</button><button type="button" data-bg="night">🌙 밤하늘</button><button type="button" data-bg="festival">🎪 축제장</button><button type="button" data-bg="custom">📷 내 사진</button></div>'''
          s=s.replace(marker,controls,1)

          # 2) Add the reference-style preset buttons and make the background image fill the poster.
          css='''.bgPresets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}.bgPresets button{padding:8px 3px;border:1px solid #40516a;border-radius:6px;background:#17243a;color:#fff;font-size:10px;font-weight:900;cursor:pointer}.bgPresets button.active{background:#ffd21c;color:#111;border-color:#ffd21c}.poster{background:#061426}.bg{z-index:0}.overlay{z-index:1;background:linear-gradient(180deg,rgba(0,8,24,.03),rgba(0,7,22,.08) 45%,rgba(0,0,0,.55) 100%)}.f{z-index:2}.f3 .title{font-family:'Black Han Sans','Jua',sans-serif;letter-spacing:-1px}.f3 .highlight{font-family:'Jua',sans-serif}.f3 .ribbon{width:86%;padding:10px 28px;background:#c71919;border:2px solid #ffd21c;clip-path:none}.f3 .ribbon:before,.f3 .ribbon:after{background:#c71919;border:2px solid #ffd21c;top:-2px;width:54px;height:calc(100% + 4px);z-index:-1}.f3 .ribbon:before{left:-48px;clip-path:polygon(100% 0,0 0,30% 50%,0 100%,100% 100%)}.f3 .ribbon:after{right:-48px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}'''
          anchor='.hidden{display:none!important}'
          if '.bgPresets{' not in s:
              s=s.replace(anchor,css+anchor,1)

          # 3) Replace the background initialization with selectable photo presets.
          old="$('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bg').src=r.result};r.readAsDataURL(f)};"
          new='''const bgPresets={market:'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1200&q=85',stage:'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1200&q=85',lights:'https://images.unsplash.com/photo-1517457373958-b7bdd4587205?auto=format&fit=crop&w=1200&q=85',night:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=85',festival:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=85'};function selectBg(k){if(k==='custom')return;const u=bgPresets[k];if(!u)return;$('bg').src=u;$('bg').style.display='block';document.querySelectorAll('#bgPresets button').forEach(b=>b.classList.toggle('active',b.dataset.bg===k))}document.querySelectorAll('#bgPresets button').forEach(b=>b.onclick=()=>selectBg(b.dataset.bg));$('bgFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bg').src=r.result;$('bg').style.display='block';document.querySelectorAll('#bgPresets button').forEach(b=>b.classList.remove('active'))};r.readAsDataURL(f)});selectBg('market');'''
          if old not in s:
              raise SystemExit('background JS marker not found')
          s=s.replace(old,new,1)

          # 4) Put the four bottom cards lower and larger like the supplied reference poster.
          s=s.replace('.cards{position:absolute;left:25px;right:25px;bottom:65px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}', '.cards{position:absolute;left:25px;right:25px;bottom:60px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m '시안 기준 디자인 적용 완료'
          git push
      - name: Remove helper
        run: |
          git rm .github/workflows/apply-reference-design.yml
          git commit -m '시안 적용 보조 작업 정리'
          git push