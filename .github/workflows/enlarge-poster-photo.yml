name: Enlarge poster photo boxes

on:
  push:
    paths:
      - '.github/workflows/enlarge-poster-photo.yml'

permissions:
  contents: write

jobs:
  enlarge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enlarge only performer photo boxes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('standalone/poster_format23_admin_v5.html')
          s = p.read_text(encoding='utf-8')
          old = '.person img,.blank{width:100%;height:67px;object-fit:cover;background:#111;display:block}'
          new = '.person img,.blank{width:100%;height:95px;object-fit:cover;background:#111;display:block}'
          if old not in s:
              raise SystemExit('target CSS not found; no changes made')
          s2 = s.replace(old, new, 1)
          if s2 == s:
              raise SystemExit('no change made')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m 'Enlarge poster performer photo boxes'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/enlarge-poster-photo.yml
          git commit -m 'Remove temporary poster photo workflow'
          git push
