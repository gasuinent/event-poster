name: Enlarge performer photo boxes only

on:
  push:
    paths:
      - '.github/workflows/enlarge-poster-photo.yml'

permissions:
  contents: write

jobs:
  enlarge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only performer photo height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          old='.person img,.blank{width:100%;height:67px;object-fit:cover;background:#111;display:block}'
          new='.person img,.blank{width:100%;height:95px;object-fit:cover;background:#111;display:block}'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m 'Enlarge performer photo boxes only'
          git push
