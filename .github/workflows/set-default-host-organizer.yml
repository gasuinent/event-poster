name: Set default host organizer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-default-host-organizer.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set defaults in existing ②③ manager only
        shell: python
        run: |
          from pathlib import Path
          p=Path('standalone/poster_format23_admin.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('id="host" value="울진군"', 'id="host" value="가수인생활 엔터테인먼트"')
          s=s.replace('id="organizer" value="울진바지게시장 상인회"', 'id="organizer" value="가수인생활 엔터테인먼트"')
          p.write_text(s,encoding='utf-8')
      - name: Commit changed manager
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin.html
          git commit -m '기본 주최 주관을 가수인생활 엔터테인먼트로 설정' || exit 0
          git push