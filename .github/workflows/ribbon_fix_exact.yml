name: Ribbon exact fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '리본 방향 수정 완료') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ribbon tails
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          a='.ribbon:before{left:-44px;clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%,18% 50%)}.ribbon:after{right:-44px;clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%,22% 50%)}'
          b='.ribbon:before{left:-44px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,25% 50%)}.ribbon:after{right:-44px;clip-path:polygon(0 0,100% 0,75% 50%,100% 100%,0 100%)}'
          if a not in s: raise SystemExit('target ribbon CSS not found')
          p.write_text(s.replace(a,b,1),encoding='utf-8')
          PY
      - name: Commit target and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m '리본 방향 수정 완료'
          git push
          git rm .github/workflows/ribbon_fix_exact.yml
          git commit -m '리본 수정 작업 파일 정리'
          git push