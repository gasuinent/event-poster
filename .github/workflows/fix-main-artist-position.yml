name: Fix main artist position
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix main artist position') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move main artist below title area
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.mainArtist{position:absolute;z-index:7;right:18px;top:155px;width:155px;height:260px;'
          new='.mainArtist{position:absolute;z-index:7;right:18px;top:255px;width:145px;height:200px;'
          if old not in s:
              raise SystemExit('mainArtist CSS target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix main artist position'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-main-artist-position.yml
          git commit -m 'Remove temporary position workflow'
          git push
