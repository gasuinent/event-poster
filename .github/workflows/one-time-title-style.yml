name: One-time poster controls patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-poster-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested poster fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) 출연자 사진은 박스 안에서 원본 전체가 보이도록 수정
          s = s.replace(
              '.artistCard img{width:100%;height:82px;object-fit:contain;object-position:center;background:#111;display:block}',
              '.artistCard img{width:100%;height:82px;object-fit:contain!important;object-position:center!important;background:#111;display:block;padding:2px}'
          )

          # 2) 행사별 배경 디자인은 카테고리 버튼으로만 필터링
          patch = r'''<style id="poster-category-photo-fix">
          .artistCard img{object-fit:contain!important;object-position:center!important;max-width:100%;max-height:82px;padding:2px}
          </style>
          <script id="poster-category-filter-fix">
          (function(){
            function install(){
              const cats=document.getElementById('cats');
              const grid=document.getElementById('grid');
              if(!cats||!grid)return false;
              if(cats.dataset.categoryFixed==='1')return true;
              const cards=Array.from(grid.querySelectorAll('.card'));
              if(!cards.length)return false;
              cats.dataset.categoryFixed='1';
              const labels=[
                ['all','전체'],['night','🌙 야시장'],['concert','🎤 공연'],['festival','🎉 축제'],
                ['sports','🏃 체육대회'],['golf','⛳ 골프대회'],['specialty','🌶️ 지역특산물'],
                ['market','🛍️ 시장행사'],['general','✨ 일반행사']
              ];
              cats.innerHTML='';
              function text(card){return (card.textContent||'').replace(/\\s+/g,' ')}
              function match(card,key){
                if(key==='all')return true;
                const t=text(card);
                if(key==='night')return /야시장|야간/.test(t);
                if(key==='concert')return /공연|무대|콘서트|라이브|마이크/.test(t);
                if(key==='festival')return /축제|불꽃|빛축제|기념행사/.test(t);
                if(key==='sports')return /체육|운동|스포츠|경기장|달리기|시상식|선수|응원/.test(t);
                if(key==='golf')return /골프/.test(t);
                if(key==='specialty')return /특산|농산|장터|먹거리|농촌|수확/.test(t);
                if(key==='market')return /시장|상점|쇼핑/.test(t);
                if(key==='general')return /고급행사|세련된 행사|문화행사|시민행사|일반/.test(t);
                return true;
              }
              function select(key,btn){
                cats.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
                btn.classList.add('active');
                cards.forEach(c=>c.style.display=match(c,key)?'':'none');
              }
              labels.forEach((item,i)=>{
                const b=document.createElement('button');
                b.type='button'; b.className='cat'+(i===0?' active':''); b.textContent=item[1];
                b.addEventListener('click',function(){select(item[0],b)});
                cats.appendChild(b);
              });
              cards.forEach(c=>c.style.display='');
              return true;
            }
            function start(){
              if(install())return;
              const grid=document.getElementById('grid');
              if(grid){
                const ob=new MutationObserver(function(){if(install())ob.disconnect()});
                ob.observe(grid,{childList:true,subtree:true});
                setTimeout(function(){ob.disconnect()},5000);
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();
          </script>'''
          if 'id="poster-category-filter-fix"' not in s:
              s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit requested fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-title-style.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'fix: show full performer photos and filter poster designs by category'
          git push
