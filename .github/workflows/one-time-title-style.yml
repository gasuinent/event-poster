name: One-time poster controls patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-poster-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only poster preview and PNG download controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the previously inserted malformed control script only.
          marker = 'window.__posterControlsAdded=true;'
          if marker in s:
              pos = s.index(marker)
              start = s.rfind('<script', 0, pos)
              end_tag = s.find('</script>', pos)
              if start >= 0 and end_tag >= 0:
                  end = end_tag + len('</script>')
                  # The old patch used literal backslashes around newlines.
                  while end < len(s) and s[end] in '\\n\\r':
                      end += 1
                  s = s[:start] + s[end:]

          # Ensure the two controls exist directly under the apply button.
          controls = '<div class="posterActions"><button class="previewBtn" id="previewBtn" type="button">👁 적용 미리보기</button><button class="downloadBtn" id="downloadBtn" type="button">⬇ 포스터 다운로드(PNG)</button></div>'
          if 'id="downloadBtn"' not in s:
              anchor = '<button class="apply" id="applyBtn">⬇ 선택한 디자인 포스터에 적용</button>'
              if anchor not in s:
                  raise SystemExit('apply button not found')
              s = s.replace(anchor, anchor + controls, 1)

          css = '.posterActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.previewBtn,.downloadBtn{padding:12px;border:1px solid #ffd21c;border-radius:7px;font-weight:900;cursor:pointer;font-size:12px}.previewBtn{background:#243f82;color:#fff}.downloadBtn{background:#ffd21c;color:#111}.previewBtn:hover,.downloadBtn:hover{filter:brightness(1.08)}'
          if '.posterActions{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          if 'src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"' not in s:
              s = s.replace('<script>', '<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>\n<script>', 1)

          clean = '''<script>
          (function(){
            function bindPosterControls(){
              const preview=document.getElementById('previewBtn');
              const download=document.getElementById('downloadBtn');
              const apply=document.getElementById('applyBtn');
              if(preview){
                preview.onclick=function(){
                  if(apply) apply.click();
                  const poster=document.querySelector('.poster');
                  if(poster) poster.scrollIntoView({behavior:'smooth',block:'center'});
                };
              }
              if(download){
                download.onclick=async function(){
                  const poster=document.querySelector('.poster');
                  if(!poster) return;
                  const old=download.textContent;
                  download.textContent='⏳ 다운로드 준비 중...';
                  download.disabled=true;
                  try{
                    if(typeof window.html2canvas!=='function') throw new Error('html2canvas unavailable');
                    const canvas=await window.html2canvas(poster,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#08152e',logging:false});
                    const link=document.createElement('a');
                    link.download='행사포스터.png';
                    link.href=canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                  }catch(err){
                    console.error(err);
                    alert('포스터 PNG 다운로드에 실패했습니다. 잠시 후 다시 시도해 주세요.');
                  }finally{
                    download.textContent=old;
                    download.disabled=false;
                  }
                };
              }
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bindPosterControls);
            else bindPosterControls();
          })();
          </script>
          '''
          s = s.replace('</body>', clean + '</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair poster preview and PNG download controls'
          git push
