name: Event info one line
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make place host organizer one line without ellipsis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.infoValue{flex:1;color:#fff;font-size:13px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}'
          old2='.infoValue{flex:1;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}'
          new='.infoValue{flex:1;color:#fff;font-size:13px;white-space:nowrap;overflow:visible;text-overflow:clip;line-height:1.25}'
          if old in s:
              s=s.replace(old,new,1)
          elif old2 in s:
              s=s.replace(old2,new,1)
          else:
              print('Already fixed or target not present')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m '장소 주최 주관 말줄임표 제거' && git push)
