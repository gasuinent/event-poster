name: Fix duplicate main artist display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert duplicate prevention patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- DUPLICATE-MAIN-ARTIST-FIX -->'
          if marker not in s:
              patch='''\n<!-- DUPLICATE-MAIN-ARTIST-FIX -->\n<script>\n(function(){\n  function removeMainDuplicate(){\n    const main=document.getElementById('mainImg');\n    const grid=document.getElementById('artistGrid');\n    if(!main||!grid||!main.src)return;\n    const src=main.src;\n    grid.querySelectorAll('.artistCard img').forEach(function(img){\n      if(img.src===src){\n        const card=img.closest('.artistCard');\n        if(card)card.remove();\n      }\n    });\n  }\n  const grid=document.getElementById('artistGrid');\n  if(grid){new MutationObserver(removeMainDuplicate).observe(grid,{childList:true,subtree:true});}\n  const main=document.getElementById('mainImg');\n  if(main){new MutationObserver(removeMainDuplicate).observe(main,{attributes:true,attributeFilter:['src']});}\n  setTimeout(removeMainDuplicate,50);\n  setTimeout(removeMainDuplicate,300);\n  setTimeout(removeMainDuplicate,1000);\n})();\n</script>\n'''
              if '</body>' not in s: raise SystemExit('body tag missing')
              p.write_text(s.replace('</body>',patch+'</body>',1),encoding='utf-8')
          else:
              print('patch already present')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Prevent main artist duplicate in performer cards'
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-main-artist-duplicate.yml || true
          git commit -m 'Remove temporary repair workflow' || true
          git push || true
