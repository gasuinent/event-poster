name: Fix main artist duplicate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude main artist from poster performer cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('function renderPoster(){')
          if start<0: raise SystemExit('renderPoster not found')
          end=s.find("$('addBtn').onclick=addPerformer", start)
          if end<0: raise SystemExit('renderPoster end not found')
          block=s[start:end]
          if 'performers.filter(p=>!p.main).forEach' not in block:
              block=block.replace('performers.forEach(p=>{','performers.filter(p=>!p.main).forEach(p=>{',1)
              s=s[:start]+block+s[end:]
              p.write_text(s,encoding='utf-8')
          else:
              print('already fixed')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Exclude main artist from performer cards'; git push; fi
          git rm .github/workflows/fix-main-artist-duplicate.yml
          git commit -m 'Remove temporary repair workflow'
          git push
