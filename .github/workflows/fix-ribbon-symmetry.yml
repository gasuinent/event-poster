name: Fix ribbon symmetry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '리본 꼬리 방향 수정 완료') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reverse ribbon tail direction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          old='.ribbon:before{left:-61px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,25% 50%)}.ribbon:after{right:-61px;clip-path:polygon(0 0,100% 0,75% 50%,100% 100%,0 100%)}'
          new='.ribbon:before{left:-61px;transform:rotate(180deg);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,25% 50%)}.ribbon:after{right:-61px;transform:rotate(180deg);clip-path:polygon(0 0,100% 0,75% 50%,100% 100%,0 100%)}'
          if old not in s:
              raise SystemExit('현재 리본 CSS를 찾지 못했습니다.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fixed HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m '리본 꼬리 방향 수정 완료'
          git push