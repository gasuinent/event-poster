name: Repair main artist display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair main artist rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '''function renderPoster(){\nconst g=$(\'artistGrid\');g.innerHTML=\'\';\nperformers.forEach(p=>{const c=document.createElement(\'div\');c.className=\'artistCard\';c.innerHTML=(p.src?\'<img src="\'+p.src+\'">\':\'<div style="height:50px;background:#151515"></div>\')+\'<div class="name">\'+escapeHtml(p.text||\'출연가수\')+\'</div>\';g.appendChild(c)});\nconst ma=$(\'mainArtist\');if(ma)ma.style.display=\'none\';\n}\n'''
          new = '''function renderPoster(){\nconst g=$(\'artistGrid\');\ng.innerHTML=\'\';\nperformers.forEach(p=>{\nconst c=document.createElement(\'div\');\nc.className=\'artistCard\';\nc.innerHTML=(p.src?\'<img src="\'+p.src+\'">\':\'<div style="height:50px;background:#151515"></div>\')+\'<div class="name">\'+escapeHtml(p.text||\'출연가수\')+\'</div>\';\ng.appendChild(c);\n});\n\n/* 메인가수 표시 유지 */\nconst main=performers.find(p=>p.main);\nconst ma=$(\'mainArtist\');\nif(ma){\n  if(main){\n    const img=$(\'mainImg\');\n    const label=$(\'mainLabel\');\n    label.textContent=main.text||\'메인가수\';\n    if(main.src){\n      img.src=main.src;\n      img.style.display=\'block\';\n      ma.style.display=\'block\';\n    }else{\n      img.removeAttribute(\'src\');\n      img.style.display=\'none\';\n      ma.style.display=\'block\';\n    }\n  }else{\n    ma.style.display=\'none\';\n  }\n}\n}\n'''
          if old not in s:
              raise SystemExit("Target renderPoster block not found; no changes made.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-main-artist.yml
          git rm .github/workflows/repair-main-artist.yml
          git commit -m "Fix main artist display"
          git push
