name: Fix performer photo fill
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge performer photo height only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='grid-auto-rows:82px'
          new='grid-auto-rows:105px'
          old2='.artistCard{height:82px'
          new2='.artistCard{height:105px'
          old3='.artistCard img{width:100%;height:61px;min-height:61px'
          new3='.artistCard img{width:100%;height:84px;min-height:84px'
          changed=False
          for a,b in ((old,new),(old2,new2),(old3,new3)):
              if a in s:
                  s=s.replace(a,b,1)
                  changed=True
          if not changed:
              raise SystemExit(0)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '출연가수 사진 세로 크기만 확대'
          git push
