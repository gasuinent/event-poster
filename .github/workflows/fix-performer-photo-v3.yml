name: Fix performer photo fill
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair main artist display
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=\"const ma=$('mainArtist');if(ma)ma.style.display='none';\"; new=\"const main=performers.find(p=>p.main);const ma=$('mainArtist');if(ma){if(main){const img=$('mainImg');const label=$('mainLabel');label.textContent=main.text||'메인가수';if(main.src){img.src=main.src;img.style.display='block';ma.style.display='block';}else{img.removeAttribute('src');img.style.display='none';ma.style.display='block';}}else{ma.style.display='none';}}\"; s=s.replace(old,new,1); t=Path('.github/workflows/repair-main-artist.yml'); t.unlink(missing_ok=True); p.write_text(s,encoding='utf-8')"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/repair-main-artist.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '메인가수 표시 복구'
          git push
