name: Fix performer photo fill
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix performer photo cells and main artist display
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''function renderPoster(){
const g=$('artistGrid');g.innerHTML='';
performers.forEach(p=>{const c=document.createElement('div');c.className='artistCard';c.innerHTML=(p.src?'<img src="'+p.src+'">':'<div style="height:50px;background:#151515"></div>')+'<div class="name">'+escapeHtml(p.text||'출연가수')+'</div>';g.appendChild(c)});
const ma=$('mainArtist');if(ma)ma.style.display='none';
}
'''

          new='''function renderPoster(){
const g=$('artistGrid');
g.innerHTML='';
performers.forEach(p=>{
const c=document.createElement('div');
c.className='artistCard';
c.innerHTML=(p.src?'<img src="'+p.src+'">':'<div style="height:50px;background:#151515"></div>')+'<div class="name">'+escapeHtml(p.text||'출연가수')+'</div>';
g.appendChild(c);
});

/* 메인가수 표시 유지 */
const main=performers.find(p=>p.main);
const ma=$('mainArtist');
if(ma){
  if(main){
    const img=$('mainImg');
    const label=$('mainLabel');
    label.textContent=main.text||'메인가수';
    if(main.src){
      img.src=main.src;
      img.style.display='block';
      ma.style.display='block';
    }else{
      img.removeAttribute('src');
      img.style.display='none';
      ma.style.display='block';
    }
  }else{
    ma.style.display='none';
  }
}
}
'''

          changed=False
          if old in s:
              s=s.replace(old,new,1)
              changed=True

          marker='<!-- performer-photo-fill-v4 -->'
          if marker not in s:
              inject='''
<style id="performer-photo-fill-v4">
.artistCard{position:relative!important;overflow:hidden!important}
.artistCard img{width:100%!important;height:82px!important;object-fit:cover!important;object-position:center center!important;padding:0!important;display:block!important;transform:scale(2.15)!important;transform-origin:center center!important}
.artistCard .name{position:relative!important;z-index:3!important;background:rgba(0,0,0,.92)!important;height:24px!important;line-height:14px!important;padding:5px 3px!important}
</style>
<!-- performer-photo-fill-v4 -->
'''
              s=s.replace('</body>',inject+'</body>',1)
              changed=True

          if changed:
              p.write_text(s,encoding='utf-8')

          temp=Path('.github/workflows/repair-main-artist.yml')
          if temp.exists():
              temp.unlink()

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/repair-main-artist.yml .github/workflows/fix-performer-photo-v3.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '메인가수 표시 유지 및 출연자 사진 보정'
          git pull --rebase origin main
          git push
