name: Fix performer photo fill
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix performer photo cells
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- performer-photo-fill-v3 -->'
          if marker in s:
              raise SystemExit('already fixed')
          inject='''
<style id="performer-photo-fill-v3">
.artistCard{position:relative;overflow:hidden!important}
.artistCard img{width:100%!important;height:82px!important;object-fit:cover!important;object-position:center center!important;padding:0!important;display:block!important;transform:scale(1.55)!important;transform-origin:center center!important}
.artistCard .name{position:relative;z-index:3;background:rgba(0,0,0,.92);height:24px;line-height:14px;padding:5px 3px!important}
</style>
<!-- performer-photo-fill-v3 -->
'''
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '출연자 사진 칸 전체 채움 수정'
          git pull --rebase origin main
          git push
