name: Fix performer start
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-performer-start.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing ②③ manager only
        shell: python
        run: |
          from pathlib import Path
          p=Path('standalone/poster_format23_admin.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("for(let i=0;i<7;i++)$('add').click();", "$('add').click();")
          s=s.replace('출연자 관리 (최대 7명)', '출연자 관리 (최대 7명 · 한 사람씩 추가)')
          s=s.replace('id="host" value="울진군"', 'id="host" value="가수인생활 엔터테인먼트"')
          s=s.replace('id="organizer" value="울진바지게시장 상인회"', 'id="organizer" value="가수인생활 엔터테인먼트"')
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin.html
          git commit -m '출연진 1명 시작 및 주최 주관 기본값 설정' || exit 0
          git push