name: Apply poster reference layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply poster reference layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update poster layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_old='.mark{position:absolute;z-index:10;left:10px;top:10px;color:#ffd21c;background:rgba(0,0,0,.82);border:1px solid #ffd21c;border-radius:4px;padding:5px;font-size:9px}'
          css_new=css_old+'\n.info{position:absolute;z-index:9;left:20px;right:20px;bottom:20px;height:170px;padding:13px 18px;background:rgba(0,0,0,.9);line-height:1.2;font-size:14px;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:left;overflow:hidden}.info .infoRow{width:calc(100% - 205px)}.infoMessage{position:absolute;right:18px;top:32px;width:175px;text-align:center;color:#fff;font-size:18px;font-weight:700;line-height:1.35;text-shadow:1px 2px 4px #000}.infoMessage strong{display:block;color:#ffd21c;font-size:24px;margin-top:4px}.posterFooter{position:absolute;z-index:10;left:20px;right:20px;bottom:4px;height:32px;text-align:center;color:#fff;font-size:15px;font-weight:700;text-shadow:1px 2px 4px #000;white-space:nowrap}.posterFooter .star{color:#ffd21c;font-size:22px;margin-right:8px}.posterFooter .music{color:#ffd21c;font-size:20px;margin-left:8px}'
          if css_old not in s:
              raise SystemExit('CSS anchor not found')
          if '.posterFooter' not in s:
              s=s.replace(css_old,css_new,1)
          html_anchor='<div class="info" id="pInfo"></div><div class="mark" id="mark"></div>'
          html_new='<div class="info" id="pInfo"><div class="infoMessage">많은 관심과<br><strong>참여</strong> 부탁드립니다!</div></div><div class="posterFooter"><span class="star">☆</span>아랫장야시장에서 만나요!<span class="music">♪</span></div><div class="mark" id="mark"></div>'
          if html_anchor not in s:
              raise SystemExit('HTML anchor not found')
          s=s.replace(html_anchor,html_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply poster reference footer and invitation layout'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-poster-reference-layout.yml
          git commit -m 'Remove temporary poster layout workflow'
          git push
