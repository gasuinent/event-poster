name: Apply poster info layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Apply poster info layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=""".info{position:absolute;z-index:9;left:20px;right:20px;bottom:20px;height:145px;padding:14px;text-align:center;background:rgba(0,0,0,.9);line-height:1.6;font-size:14px;display:flex;flex-direction:column;justify-content:center}"""
          new=""".info{position:absolute;z-index:9;left:20px;right:20px;bottom:20px;height:170px;padding:13px 18px;background:rgba(0,0,0,.9);line-height:1.2;font-size:14px;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:left}.infoRow{display:flex;align-items:center;min-height:34px;border-bottom:1px solid rgba(255,255,255,.18)}.infoRow:last-child{border-bottom:0}.infoIcon{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#ffd21c;color:#111;display:flex;align-items:center;justify-content:center;font-size:17px;margin-right:10px}.infoLabel{flex:0 0 54px;color:#ffd21c;font-weight:900;font-size:13px}.infoValue{flex:1;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.infoDesc{margin-left:94px;color:#fff;font-size:11px;opacity:.9}"""
          if old not in s:
              raise SystemExit('target CSS not found')
          s=s.replace(old,new,1)
          old2="$('pInfo').innerHTML=$('date').value+'<br>'+$('time').value+(h?'<br>주최: '+h:'')+(o?'<br>주관: '+o:'')+($('desc').value?'<br><small>'+escapeHtml($('desc').value)+'</small>':'');"
          new2="""const rows=[]; rows.push('<div class=\"infoRow\"><span class=\"infoIcon\">📅</span><span class=\"infoLabel\">일 시</span><span class=\"infoValue\">'+escapeHtml($('date').value)+( $('time').value ? ' · '+escapeHtml($('time').value) : '' )+'</span></div>'); rows.push('<div class=\"infoRow\"><span class=\"infoIcon\">📍</span><span class=\"infoLabel\">장 소</span><span class=\"infoValue\">'+escapeHtml($('venue').value)+'</span></div>'); if(h) rows.push('<div class=\"infoRow\"><span class=\"infoIcon\">👥</span><span class=\"infoLabel\">주 최</span><span class=\"infoValue\">'+escapeHtml(h)+'</span></div>'); if(o) rows.push('<div class=\"infoRow\"><span class=\"infoIcon\">📣</span><span class=\"infoLabel\">주 관</span><span class=\"infoValue\">'+escapeHtml(o)+'</span></div>'); $('pInfo').innerHTML=rows.join('')+($('desc').value?'<div class=\"infoDesc\">'+escapeHtml($('desc').value)+'</div>':'');"""
          if old2 not in s:
              raise SystemExit('target JS not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply poster info layout'
          git push
          git rm .github/workflows/apply-poster-info.yml
          git commit -m 'Remove one-time poster workflow'
          git push
