name: Night Sky Clean Fix
on:
  push:
    branches: [fix/night-sky-clean]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply night sky ③ clean fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace night sky ③
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          old='https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85'
          new='https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=900&q=85'
          if old not in s:
              raise SystemExit('target URL not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m 'Apply night sky ③ clean fix'
          git push origin HEAD:fix/night-sky-clean
