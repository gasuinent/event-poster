name: Add poster formats 2 and 3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  add-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only format selector and templates
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="posterFormatSection"' in s:
              raise SystemExit(0)
          controls='''<div class="section" id="posterFormatSection"><h3>④ 포스터 형식 선택</h3><div class="posterFormatBtns"><button type="button" class="posterFormatBtn active" data-format="1">① 현재형</button><button type="button" class="posterFormatBtn" data-format="2">② 행사형</button><button type="button" class="posterFormatBtn" data-format="3">③ 축제형</button></div><p class="hint">기존 행사정보·출연자·사진은 그대로 두고 포스터 구성만 전환합니다.</p></div>'''
          anchor='<div class="section"><h3>③ 출연자 관리</h3>'
          if anchor not in s: raise SystemExit('anchor not found')
          s=s.replace(anchor,controls+anchor,1)
          css='''<style id="posterFormat23Style">.posterFormatBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.posterFormatBtn{padding:10px 4px;border:1px solid #40506a;border-radius:7px;background:#172235;color:#fff;font-weight:900;cursor:pointer}.posterFormatBtn.active{background:#ffd21c;color:#111}.formatCanvas{position:absolute;inset:0;z-index:30;display:none;overflow:hidden}.poster.format2 .formatCanvas.f2,.poster.format3 .formatCanvas.f3{display:block}.poster.format2>.txt,.poster.format3>.txt,.poster.format2>.performersTitle,.poster.format3>.performersTitle,.poster.format2>.artistArea,.poster.format3>.artistArea,.poster.format2>.mainArtist,.poster.format3>.mainArtist,.poster.format2>.info,.poster.format3>.info,.poster.format2>.infoInvite,.poster.format3>.infoInvite,.poster.format2>.posterFooter,.poster.format3>.posterFooter,.poster.format2>.mark,.poster.format3>.mark{display:none!important}.pf{position:absolute;inset:0;color:#fff;text-align:center;font-family:Arial,"Noto Sans KR",sans-serif;text-shadow:2px 3px 5px #000;background:linear-gradient(180deg,rgba(0,5,20,.12),rgba(0,5,20,.78))}.f2{padding:28px 22px}.f2 .top{color:#ffd76a;font-size:14px;font-weight:900}.f2 .title{font-family:'Nanum Brush Script','Gugi',serif;font-size:58px;line-height:1.05;margin-top:12px}.f2 .hi{font-family:'Nanum Brush Script','Gugi',serif;color:#ffd21c;font-size:55px;font-weight:900}.f2 .venue{font-size:17px;font-weight:900;margin-top:8px}.f2 .date{font-size:25px;color:#ffd21c;font-weight:900;margin-top:18px}.f2 .boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.f2 .box{background:rgba(0,0,0,.68);border:1px solid #ffd21c;border-radius:8px;padding:9px;min-height:100px;text-align:left}.f2 .box h4{margin:0 0 7px;text-align:center;color:#ffd21c}.f2 .box p{font-size:10px;line-height:1.45;margin:3px 0}.f2 .people{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}.fp{background:rgba(0,0,0,.78);border:1px solid #ffd21c;overflow:hidden}.fp img,.fp .blank{width:100%;height:55px;object-fit:cover;background:#111}.fp b{display:block;font-size:7px;padding:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.f2 .foot{position:absolute;left:18px;right:18px;bottom:15px;border-top:1px solid #d8b34c;padding-top:7px;font-size:10px}.f3{padding:20px 18px}.f3 .year{font-size:22px;font-weight:900}.f3 .title{font-family:'Nanum Brush Script','Gugi',serif;font-size:68px;line-height:.94;color:#fff;font-weight:900;text-shadow:4px 5px 0 #a31313,6px 7px 7px #000}.f3 .hi{font-family:'Nanum Brush Script','Gugi',serif;font-size:62px;color:#ffd21c;font-weight:900}.f3 .ribbon{margin:12px auto;background:#c51d1d;border:2px solid #ffb51c;padding:9px;font-weight:900;max-width:470px}.f3 .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f3 .meta div{background:rgba(0,0,0,.72);border:1px solid #ffd21c;border-radius:7px;padding:8px;font-size:10px}.f3 .people{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.f3 .people img,.f3 .people .blank{height:58px}.f3 .cards{position:absolute;left:18px;right:18px;bottom:58px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.f3 .cardx{background:rgba(255,255,255,.94);color:#111;text-shadow:none;border-radius:9px;padding:7px;min-height:85px}.f3 .cardx h4{margin:0 0 5px;font-size:11px}.f3 .cardx p{margin:3px 0;font-size:8px}.f3 .foot{position:absolute;left:18px;right:18px;bottom:13px;background:#ffd21c;color:#142039;text-shadow:none;border-radius:18px;padding:7px;font-size:9px;font-weight:900}</style>'''
          s=s.replace('</style>',css+'</style>',1)
          html='''<div class="formatCanvas f2"><div class="pf f2"><div class="top" data-f="head"></div><div class="title" data-f="title"></div><div class="hi" data-f="hi"></div><div class="venue" data-f="venue"></div><div class="date" data-f="date"></div><div class="boxes"><div class="box"><h4>행사 프로그램</h4><p data-f="m1"></p><p data-f="m2"></p></div><div class="box"><h4>함께하는 무대</h4><p data-f="host"></p><p data-f="org"></p></div></div><div class="people" data-people="2"></div><div class="foot" data-f="foot"></div></div></div><div class="formatCanvas f3"><div class="pf f3"><div class="year" data-f="year"></div><div class="title" data-f="title"></div><div class="hi" data-f="hi"></div><div class="ribbon" data-f="ribbon"></div><div class="meta"><div>📅 <span data-f="date"></span></div><div>📍 <span data-f="venue"></span></div></div><div class="people" data-people="3"></div><div class="cards"><div class="cardx"><h4>맛있는 먹거리</h4><p>지역 먹거리 · 체험부스</p><p>시장 특색상품</p></div><div class="cardx"><h4>신나는 공연</h4><p>주민공연 · 초청공연</p><p>버스킹 · 특별무대</p></div><div class="cardx"><h4>즐길거리 가득</h4><p>플리마켓 · 체험행사</p><p>가족 참여 프로그램</p></div><div class="cardx"><h4>특별 이벤트</h4><p>상품권 · 경품추첨</p><p>현장 참여 이벤트</p></div></div><div class="foot" data-f="foot"></div></div></div>'''
          marker='</div></main></div>'
          if marker not in s: raise SystemExit('poster marker not found')
          s=s.replace(marker,html+marker,1)
          js='''<script id="posterFormat23Script">(()=>{const q=(x,r=document)=>r.querySelector(x),qa=(x,r=document)=>[...r.querySelectorAll(x)],v=id=>q('#'+id)?.value||'';function dt(){const d=v('date'),t=v('time');if(!d)return t;const a=d.split('-');return `${a[0]}. ${+a[1]}. ${+a[2]}.`+(t?' · '+t:'')}function people(){return qa('#artistGrid .artistCard').map(c=>({n:q('.name',c)?.textContent||'출연가수',s:q('img',c)?.src||''}))}function fill(){const ps=people(),vals={head:v('headline'),title:v('title')||'행사 제목',hi:v('highlight'),venue:v('venue'),date:dt(),year:(v('date')||'').slice(0,4)+'년',m1:v('bottomMsg1')||'먹거리 · 볼거리 · 즐길거리 가득',m2:v('bottomMsg2')||'많은 관심과 참여 부탁드립니다!',host:v('host')==='직접 입력'?v('hostCustom'):v('host'),org:v('organizer')==='직접 입력'?v('organizerCustom'):v('organizer')};qa('.formatCanvas').forEach(c=>{qa('[data-f]',c).forEach(e=>{const k=e.dataset.f;e.textContent=k==='foot'?vals.m2+'　'+vals.host+'　'+vals.org:k==='ribbon'?vals.m1:k==='host'?'주최 '+vals.host:k==='org'?'주관 '+vals.org:vals[k]||''});const box=q('[data-people]',c);if(box){const n=box.dataset.people==='3'?14:7;box.innerHTML=ps.slice(0,n).map(p=>`<div class="fp">${p.s?`<img src="${p.s}">`:'<div class="blank"></div>'}<b>${p.n.replace(/[&<>]/g,'')}</b></div>`).join('')}})}function set(n){const p=q('.poster');if(!p)return;p.classList.remove('format2','format3');if(n==='2')p.classList.add('format2');if(n==='3')p.classList.add('format3');qa('.posterFormatBtn').forEach(b=>b.classList.toggle('active',b.dataset.format===n));localStorage.setItem('posterFormat',n);fill()}function init(){qa('.posterFormatBtn').forEach(b=>b.onclick=()=>set(b.dataset.format));document.addEventListener('input',e=>{if(e.target.closest('.side'))setTimeout(fill,50)});document.addEventListener('change',e=>{if(e.target.closest('.side'))setTimeout(fill,70)});set(localStorage.getItem('posterFormat')||'1')}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init()})()</script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '② 행사형 ③ 축제형 포스터 형식 추가' || exit 0
          git push
