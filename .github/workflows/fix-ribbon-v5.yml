name: Fix V5 ribbon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-ribbon:
    if: ${{ !contains(github.event.head_commit.message, 'V5 중앙 리본 수정 완료') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ribbon CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('.ribbon{')
          end=s.index('.meta{', start)
          new='''.ribbon{position:relative;display:block;width:84%;margin:15px auto 14px;background:#c61c1c;border:2px solid #ffbd24;padding:11px 28px;font-size:14px;font-weight:900;line-height:1.25;z-index:1;box-shadow:0 4px 8px rgba(0,0,0,.45)}.ribbon:before,.ribbon:after{content:"";position:absolute;top:2px;width:58px;height:calc(100% - 4px);background:#a91414;border:2px solid #ffbd24;z-index:-1}.ribbon:before{left:-56px;clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%,18% 50%)}.ribbon:after{right:-56px;clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%,18% 50%)}'''
          # Build the right tail as a true mirror of the left tail.
          new=new.replace('.ribbon:after{right:-56px;clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%,18% 50%)}','.ribbon:after{right:-56px;clip-path:polygon(0 0,100% 0,18% 50%,100% 100%,0 100%,82% 50%)}')
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m 'V5 중앙 리본 수정 완료'
          git push
      - name: Remove helper workflow
        run: |
          git rm .github/workflows/fix-ribbon-v5.yml
          git commit -m '리본 수정 작업 파일 정리'
          git push