name: Fix Night Sky Distinct 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebase and fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          a='https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=85'
          b='https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85'
          first=s.find(a)
          second=s.find(a, first+1)
          if second < 0: raise SystemExit('night sky duplicate not found')
          p.write_text(s[:second]+b+s[second+len(a):],encoding='utf-8')
          PY
          git add standalone/poster_format23_admin_v5.html
          git commit -m 'Fix distinct night sky designs' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
