name: Performer photo fill fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix final performer photo override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.artistCard img{object-fit:contain!important;object-position:center!important;max-width:100%;max-height:82px;padding:2px}'
          new = '.artistCard img{width:100%!important;height:82px!important;object-fit:cover!important;object-position:center center!important;max-width:none!important;max-height:none!important;padding:0!important;transform:scale(1.65)!important;transform-origin:center center!important}'
          if old not in s:
              raise SystemExit('최종 사진 표시 CSS 대상을 찾지 못했습니다.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo '변경할 내용이 없습니다.'
            exit 0
          fi
          git commit -m '출연자 사진 칸 전체 사용 최종 수정'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
