name: Performer photo fill fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fill performer photo cells
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.artistCard img{width:100%;height:82px;object-fit:contain!important;object-position:center!important;background:#111;display:block;padding:2px}'
          new = '.artistCard img{width:100%;height:82px;object-fit:cover!important;object-position:center!important;background:#111;display:block;padding:0}'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif 'object-fit:cover!important' in s and '.artistCard img' in s:
              print('이미 사진 전체 채우기 설정이 적용되어 있습니다.')
          else:
              raise SystemExit('출연자 사진 CSS 대상을 찾지 못했습니다.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo '변경할 내용이 없습니다.'
            exit 0
          fi
          git commit -m '출연자 사진 칸 전체 사용 수정'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
