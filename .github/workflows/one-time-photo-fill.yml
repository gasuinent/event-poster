name: One-time photo fill fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill performer photo cells
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".artistCard img{width:100%;height:82px;object-fit:contain!important;object-position:center!important;background:#111;display:block;padding:2px}"
          new = ".artistCard img{width:100%;height:82px;object-fit:cover!important;object-position:center!important;background:#111;display:block;padding:0}"
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '출연자 사진 칸 전체 사용 개선'
          git push
          rm -f .github/workflows/one-time-photo-fill.yml
          git add .github/workflows/one-time-photo-fill.yml
          git commit -m '일회성 수정 작업 정리'
          git push
