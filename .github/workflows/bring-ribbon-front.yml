name: Bring ribbon to front
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '중앙 리본 앞으로 적용 완료') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ribbon layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone/poster_format23_admin_v5.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('z-index:1;box-shadow:0 4px 8px rgba(0,0,0,.45);clip-path:none}.ribbon:before', 'z-index:10;isolation:isolate;box-shadow:0 4px 8px rgba(0,0,0,.45);clip-path:none}.ribbon:before', 1)
          s=s.replace('background:#a91414;border:2px solid #ffd21c;z-index:-1}', 'background:#a91414;border:2px solid #ffd21c;z-index:0}', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/poster_format23_admin_v5.html
          git commit -m '중앙 리본 앞으로 적용 완료'
          git push
      - name: Remove helper
        run: |
          git rm .github/workflows/bring-ribbon-front.yml
          git commit -m '리본 수정 보조 작업 정리'
          git push