name: One-time poster fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- poster-fix-v2 -->'
          if marker not in s:
              s=s.replace('.artistCard img{width:100%;height:82px;object-fit:contain;object-position:center;background:#111;display:block}', '.artistCard img{width:100%;height:82px;object-fit:contain!important;object-position:center!important;background:#111;display:block;padding:2px}')
              patch=r'''\n<!-- poster-fix-v2 -->\n<script>\n(function(){\n  function setupCategoryFilter(){\n    const cats=document.getElementById('cats');\n    const grid=document.getElementById('grid');\n    if(!cats||!grid)return;\n    const labels=[['all','전체'],['night','🌙 야시장'],['concert','🎤 공연'],['festival','🎉 축제'],['sports','🏃 체육대회'],['golf','⛳ 골프대회'],['specialty','🌶️ 지역특산물'],['market','🛍️ 시장행사'],['general','✨ 일반행사']];\n    cats.innerHTML='';\n    const cards=Array.from(grid.querySelectorAll('.card'));\n    const textOf=c=>(c.textContent||'').replace(/\\s+/g,' ');\n    function match(card,key){\n      if(key==='all')return true;\n      const t=textOf(card);\n      if(key==='night')return /야시장|야간/.test(t);\n      if(key==='concert')return /공연|무대|콘서트|라이브|마이크/.test(t);\n      if(key==='festival')return /축제|불꽃|빛축제|기념행사/.test(t);\n      if(key==='sports')return /체육|운동|스포츠|경기장|달리기|시상식/.test(t);\n      if(key==='golf')return /골프/.test(t);\n      if(key==='specialty')return /특산|농산|장터|먹거리|농촌|수확/.test(t);\n      if(key==='market')return /시장|상점|쇼핑/.test(t);\n      if(key==='general')return /고급행사|세련된 행사|문화행사|시민행사|일반/.test(t);\n      return true;\n    }\n    function select(key,btn){\n      cats.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));\n      btn.classList.add('active');\n      cards.forEach(c=>c.style.display=match(c,key)?'':'none');\n    }\n    labels.forEach((item,i)=>{\n      const b=document.createElement('button');\n      b.type='button'; b.className='cat'+(i===0?' active':''); b.textContent=item[1];\n      b.addEventListener('click',()=>select(item[0],b));\n      cats.appendChild(b);\n    });\n    cards.forEach(c=>{c.style.display=''});\n  }\n  function fixArtistImages(){\n    document.querySelectorAll('.artistCard img').forEach(img=>{\n      img.style.objectFit='contain';\n      img.style.objectPosition='center';\n      img.style.maxWidth='100%';\n      img.style.maxHeight='82px';\n    });\n  }\n  setTimeout(function(){setupCategoryFilter();fixArtistImages();},150);\n  setTimeout(function(){setupCategoryFilter();fixArtistImages();},700);\n})();\n</script>\n'''
              s=s.replace('</body>', patch+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-poster-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-poster-fix.yml
          git diff --cached --quiet || git commit -m '포스터 출연자 사진 및 배경 디자인 분류 개선'
          git push
