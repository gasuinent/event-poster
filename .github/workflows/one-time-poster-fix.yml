name: One-time poster layout fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 8-column performer layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- FINAL-PERFORMER-8COL-FIX -->'
          if marker not in s:
              fix = r'''\n<!-- FINAL-PERFORMER-8COL-FIX -->\n<style>\n.artistArea{left:18px;right:18px;top:510px;bottom:190px;overflow:hidden}\n.artistGrid{left:0;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:82px;gap:4px;align-content:start}\n.artistCard{height:82px;background:rgba(0,0,0,.8);border:2px solid #ffd21c;min-width:0;text-align:center;overflow:hidden;display:flex;flex-direction:column}\n.artistCard img{width:100%!important;height:61px!important;min-height:61px!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:center center!important;background:#111;display:block;padding:0!important;margin:0!important;transform:none!important}\n.artistCard .name{height:17px;line-height:17px;padding:0 2px;font-size:9px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 17px}\n.mainArtist{display:none!important}\n</style>\n'''
              s = s.replace('</body>', fix + '\n</body>')
              s = s.replace("performers.filter(p=>!p.main).forEach(p=>", "performers.forEach(p=>")
              s = s.replace("const main=performers.find(p=>p.main);const ma=$('mainArtist');if(main){ma.style.display='block';$('mainImg').src=main.src||'';$('mainLabel').textContent=main.text||'메인가수'}else ma.style.display='none';", "const ma=$('mainArtist');if(ma)ma.style.display='none';")
              p.write_text(s,encoding='utf-8')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-poster-fix.yml
          git commit -m 'Fix performer layout to 8 columns' || exit 0
          git rm .github/workflows/one-time-poster-fix.yml || true
          git commit -m 'Remove one-time poster fix workflow' || true
          git push
