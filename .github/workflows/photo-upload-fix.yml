name: Fix performer photo upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch photo uploader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- PHOTO-UPLOAD-FIX -->'
          if marker not in s:
              patch = r'''\n<!-- PHOTO-UPLOAD-FIX -->\n<script>\n(function(){\n  document.addEventListener('change', function(e){\n    var input=e.target;\n    if(!input || !input.matches('#performers input[type="file"]')) return;\n    var files=Array.from(document.querySelectorAll('#performers .performer input[type="file"]'));\n    var index=files.indexOf(input);\n    var p=typeof performers!=='undefined' ? performers[index] : null;\n    var f=input.files && input.files[0];\n    if(!p || !f) return;\n    if(!/^image\\//i.test(f.type)){ alert('JPG, PNG, WEBP 같은 이미지 파일을 선택해 주세요.'); input.value=''; return; }\n    var reader=new FileReader();\n    reader.onload=function(ev){\n      var img=new Image();\n      img.onload=function(){\n        var max=1400, scale=Math.min(1,max/Math.max(img.width,img.height));\n        var w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));\n        var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;\n        var ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);\n        p.src=canvas.toDataURL('image/jpeg',0.88);\n        if(typeof renderPerformers==='function') renderPerformers();\n        if(typeof renderPoster==='function') renderPoster();\n      };\n      img.onerror=function(){alert('이 사진 형식은 브라우저에서 읽을 수 없습니다. JPG 또는 PNG로 저장한 뒤 다시 선택해 주세요.');};\n      img.src=ev.target.result;\n    };\n    reader.onerror=function(){alert('사진을 읽지 못했습니다. 다시 선택해 주세요.');};\n    reader.readAsDataURL(f);\n  }, true);\n})();\n</script>\n'''
              if '</body>' not in s:
                  raise SystemExit('body tag not found')
              s=s.replace('</body>',patch+'</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix performer photo upload' || exit 0
          git push
