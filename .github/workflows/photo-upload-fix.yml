name: Repair photo upload
on: push
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- PHOTO-UPLOAD-FIX-FINAL -->'
          if marker not in s:
              patch = '''<!-- PHOTO-UPLOAD-FIX-FINAL -->
          <script>
          (function(){
            document.addEventListener('change', function(e){
              const input=e.target;
              if(!input || !input.matches('#performers input[type="file"]')) return;
              const card=input.closest('.performer');
              const cards=[...document.querySelectorAll('#performers .performer')];
              const idx=cards.indexOf(card);
              const p=(typeof performers!=='undefined') ? performers[idx] : null;
              const f=input.files && input.files[0];
              if(!p || !f) return;
              if(!f.type || !f.type.startsWith('image/')){ alert('이미지 파일을 선택해 주세요.'); return; }
              const reader=new FileReader();
              reader.onload=function(ev){
                p.src=ev.target.result;
                if(typeof renderPerformers==='function') renderPerformers();
                if(typeof renderPoster==='function') renderPoster();
              };
              reader.onerror=function(){ alert('사진을 읽지 못했습니다. 다시 선택해 주세요.'); };
              reader.readAsDataURL(f);
            }, true);
          })();
          </script>
          '''
              s=s.replace('</body>', patch+'</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix performer photo upload' || exit 0
          git push