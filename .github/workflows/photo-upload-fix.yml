name: Repair performer photo upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair uploader in index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('\\n<!-- PHOTO-UPLOAD-FIX -->\\n<script>')
          if start >= 0:
              end = s.find('\\n</script>', start)
              if end >= 0:
                  s = s[:start] + s[end + len('\\n</script>'):]
          marker = '<!-- PHOTO-UPLOAD-FIX-V2 -->'
          if marker not in s:
              patch = r'''<!-- PHOTO-UPLOAD-FIX-V2 -->
<script>
(function(){
  document.addEventListener('change', function(e){
    var input=e.target;
    if(!input || !input.matches('#performers .performer input[type="file"]')) return;
    var card=input.closest('.performer');
    var list=Array.from(document.querySelectorAll('#performers .performer'));
    var idx=list.indexOf(card);
    var p=(typeof performers!=='undefined') ? performers[idx] : null;
    var f=input.files && input.files[0];
    if(!p || !f) return;
    if(!f.type || f.type.indexOf('image/')!==0){ alert('이미지 파일(JPG, PNG 등)을 선택해 주세요.'); input.value=''; return; }
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var max=1600, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        var w=Math.max(1,Math.round(img.naturalWidth*scale));
        var h=Math.max(1,Math.round(img.naturalHeight*scale));
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        p.src=canvas.toDataURL('image/jpeg',0.9);
        if(typeof renderPerformers==='function') renderPerformers();
      };
      img.onerror=function(){ alert('사진을 읽지 못했습니다. JPG 또는 PNG 사진을 다시 선택해 주세요.'); };
      img.src=ev.target.result;
    };
    reader.onerror=function(){ alert('사진 파일을 읽지 못했습니다.'); };
    reader.readAsDataURL(f);
  }, true);
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair performer photo upload' || exit 0
          git push