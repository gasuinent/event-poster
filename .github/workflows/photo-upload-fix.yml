name: Repair photo upload
on: push
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 기존에 여러 번 들어간 사진 업로드 이벤트를 제거해 중복 실행을 막습니다.
          s = re.sub(r'\s*<!-- PHOTO-UPLOAD-FIX -->.*?<!-- PHOTO-UPLOAD-FIX-FINAL -->\s*<script>.*?</script>', '', s, flags=re.S)

          marker = '<!-- FINAL-POSTER-FIX-V2 -->'
          if marker not in s:
              patch = r'''
          <style id="FINAL-POSTER-FIX-V2">
          .infoInvite{width:190px!important;right:2px!important;font-size:16px!important;line-height:1.28!important;}
          .infoInvite .accent{font-size:22px!important;margin:1px 2px!important;}
          .backgroundActions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;margin-top:12px!important;}
          .backgroundActions .apply{margin-top:0!important;padding:14px 8px!important;}
          .externalBgBtn{width:100%;padding:14px 8px;border:0;border-radius:7px;background:#243f82;color:#fff;font-weight:900;cursor:pointer;font-size:12px;}
          .externalBgBtn:hover{filter:brightness(1.08)}
          #externalBgInput{display:none}
          </style>
          <script>
          (function(){
            function setupBackground(){
              var apply=document.getElementById('applyBtn');
              if(!apply || document.getElementById('externalBgBtn')) return;
              var parent=apply.parentNode;
              var actions=document.createElement('div');
              actions.className='backgroundActions';
              parent.insertBefore(actions,apply);
              actions.appendChild(apply);
              var btn=document.createElement('button');
              btn.id='externalBgBtn'; btn.type='button'; btn.className='externalBgBtn';
              btn.textContent='📁 외부 파일 불러오기';
              actions.appendChild(btn);
              var input=document.createElement('input');
              input.id='externalBgInput'; input.type='file'; input.accept='image/*';
              parent.insertBefore(input,actions.nextSibling);
              btn.onclick=function(){input.click()};
              input.onchange=function(){
                var f=input.files&&input.files[0]; if(!f)return;
                if(!f.type || !f.type.startsWith('image/')){alert('JPG, PNG, WEBP 등의 이미지 파일을 선택해 주세요.');input.value='';return;}
                var r=new FileReader();
                r.onload=function(e){
                  var b=document.getElementById('bg'); if(b)b.src=e.target.result;
                  var st=document.getElementById('status'); if(st)st.textContent='현재 적용: 외부 파일 · '+f.name;
                  var mark=document.getElementById('mark'); if(mark)mark.textContent='외부 파일 적용됨';
                };
                r.onerror=function(){alert('외부 이미지 파일을 읽지 못했습니다. 다시 선택해 주세요.');};
                r.readAsDataURL(f);
              };
            }

            function setupPhoto(){
              if(window.__FINAL_PHOTO_HANDLER__)return;
              window.__FINAL_PHOTO_HANDLER__=true;
              document.addEventListener('change',function(e){
                var input=e.target;
                if(!input || !input.matches('#performers input[type="file"]'))return;
                e.stopImmediatePropagation();
                var card=input.closest('.performer');
                var cards=Array.prototype.slice.call(document.querySelectorAll('#performers .performer'));
                var idx=cards.indexOf(card);
                var p=(typeof performers!=='undefined')?performers[idx]:null;
                var f=input.files&&input.files[0];
                if(!p||!f)return;
                if(!f.type || !f.type.startsWith('image/')){alert('JPG, PNG, WEBP 등의 이미지 파일을 선택해 주세요.');input.value='';return;}
                var reader=new FileReader();
                reader.onload=function(ev){
                  p.src=ev.target.result;
                  var thumb=card.querySelector('.thumb');
                  if(thumb){thumb.src=p.src;thumb.style.display='block';}
                  var main=document.getElementById('mainArtist');
                  var mainImg=document.getElementById('mainImg');
                  var label=document.getElementById('mainLabel');
                  if(p.main){
                    mainImg.src=p.src;
                    mainImg.style.display='block';
                    main.style.display='block';
                    label.textContent=p.text||'메인가수';
                  }else if(typeof renderPoster==='function'){
                    renderPoster();
                  }
                };
                reader.onerror=function(){alert('사진을 읽지 못했습니다. 다시 선택해 주세요.');};
                reader.readAsDataURL(f);
              },true);
            }

            function setup(){setupBackground();setupPhoto();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
          })();
          </script>
          '''
              s=s.replace('</body>', patch+'</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '최종 사진 적용 및 외부 배경 기능 수정' || exit 0
          git push
