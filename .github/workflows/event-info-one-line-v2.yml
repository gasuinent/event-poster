name: Event info one line v2
on:
  push:
    branches: [main]
    paths:
      - 'event-info-one-line-v2.trigger'
      - '.github/workflows/event-info-one-line-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make event information one line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.infoValue{flex:1;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}'
          new='.infoValue{flex:1;color:#fff;font-size:13px;white-space:nowrap;overflow:visible;text-overflow:clip;line-height:1.25}'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m '행사정보 한줄 표시 수정' && git push)
