<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>행사 포스터 1단계</title><style>body{margin:0;background:#080d16;color:#fff;font-family:Arial,sans-serif}.wrap{display:flex;min-height:100vh}.side{width:340px;padding:20px;background:#101b2b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:2px solid #34445c;border-radius:7px;overflow:hidden;cursor:pointer}.card.active{border-color:#ffd21c}.card img{width:100%;height:130px;object-fit:cover;display:block}.card b{display:block;padding:8px;text-align:center;font-size:11px}.apply{width:100%;margin-top:12px;padding:12px;border:0;border-radius:6px;background:#1877d8;color:#fff;font-weight:900}.status{margin-top:10px;color:#ffd21c;font-size:11px}.view{flex:1;display:flex;justify-content:center;padding:25px;background:#05080e}.poster{width:540px;height:960px;position:relative;overflow:hidden}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,20,.05),rgba(0,5,20,.12) 45%,rgba(0,5,20,.55))}.txt{position:absolute;z-index:3;left:20px;right:20px;text-align:center;text-shadow:2px 3px 5px #000}.t1{top:25px;color:#ffe27b}.t2{top:80px;font-size:48px;font-weight:900}.t3{top:145px;color:#ffd21c;font-size:55px;font-weight:900}.info{position:absolute;z-index:3;bottom:35px;left:20px;right:20px;padding:18px;text-align:center;background:rgba(0,0,0,.65)}.mark{position:absolute;z-index:5;left:10px;bottom:10px;color:#ffd21c;background:#000b;padding:5px;font-size:9px}</style></head><body><div class="wrap"><aside class="side"><h2>🎨 1단계 · 배경 디자인</h2><p style="font-size:11px;color:#aab5c5">배경 선택과 포스터 적용만 테스트합니다.</p><div class="grid" id="grid"></div><button class="apply" onclick="apply()">⬇ 선택한 디자인 포스터에 적용</button><div class="status" id="status">현재 선택: 없음</div></aside><main class="view"><div class="poster"><img id="bg"><div class="shade"></div><div class="txt t1">대구 서부시장의 밤을 빛내는 특별한 무대!</div><div class="txt t2">서부시장 야시장</div><div class="txt t3">특별공연</div><div class="info">2026년 10월 9일(금) ~ 10일(토)<br>오후 7시 ~ 10시<br>대구 서부시장 야시장</div><div class="mark" id="mark"></div></div></main></div><script>function S(bg,beam,accent){return `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="${bg}"/><stop offset="1" stop-color="#050812"/></linearGradient></defs><rect width="900" height="1600" fill="url(#g)"/><g fill="#fff0a0" opacity=".9">${Array.from({length:45},(_,i)=>`<circle cx="${20+(i*97)%860}" cy="${40+(i*53)%500}" r="${i%3+1}"/>`).join('')}</g><g stroke="#fff0a0" stroke-width="3">${Array.from({length:11},(_,i)=>`<line x1="${i*90}" y1="0" x2="${i*90+12}" y2="90"/><circle cx="${i*90+12}" cy="92" r="9" fill="#ffe08a"/>`).join('')}</g><g fill="${beam}" opacity=".35">${[170,330,450,570,730].map(x=>`<polygon points="450,560 ${x-90},1050 ${x+90},1050"/>`).join('')}</g><rect y="760" width="900" height="420" fill="#101522"/><g fill="#263248"><rect x="0" y="800" width="170" height="250"/><rect x="180" y="840" width="150" height="210"/><rect x="590" y="825" width="145" height="225"/><rect x="750" y="790" width="150" height="260"/></g><g fill="#ffd66b"><rect x="25" y="840" width="35" height="28"/><rect x="90" y="880" width="35" height="28"/><rect x="610" y="875" width="35" height="28"/><rect x="790" y="850" width="35" height="28"/></g><rect x="245" y="680" width="410" height="300" rx="10" fill="#141a27" stroke="${accent}" stroke-width="8"/><rect x="280" y="720" width="340" height="190" fill="#071020"/><circle cx="450" cy="815" r="105" fill="${accent}" opacity=".18"/><g fill="#090b10">${Array.from({length:18},(_,i)=>`<circle cx="${30+i*52}" cy="${1170+(i%4)*55}" r="18"/><path d="M${10+i*52} 1200h40v180h-40z"/>`).join('')}</g></svg>`}const D=[['야시장 + 무대 + 전구',S('#071a3d','#368cff','#ffd35a')],['퍼플 조명 야시장 + 무대',S('#17083b','#9b55ff','#e7a4ff')],['축제 레드 조명 + 야시장',S('#3a080d','#ff3f55','#ffcf55')],['골드 조명 야시장 + 무대',S('#332008','#ffc43d','#ffe39a')]];let sel=-1;function render(){grid.innerHTML='';D.forEach((x,i)=>{let c=document.createElement('div');c.className='card'+(sel===i?' active':'');let u='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x[1]);c.innerHTML='<img src="'+u+'"><b>'+x[0]+'</b>';c.onclick=()=>{sel=i;render();apply()};grid.appendChild(c)})}function apply(){if(sel<0)return;let u='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(D[sel][1]);bg.src=u;status.textContent='현재 적용: '+D[sel][0];mark.textContent='적용됨: '+D[sel][0]}render();</script></body></html>
